<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="icon" type="image/png" href="favicon.png?v=yr1"><title>피자로 배우는 삼권분립</title>
<style>
/*FONTS*/
/* 레이아웃: 1280×800 고정 게임 화면을 기기 크기에 맞춰 통째로 확대·축소(가로 태블릿 기준).
   위: 진행 지도 / 가운데: 교실 장면(벽 + 식탁 + 친구 넷 + 피자) / 아래: 예람쌤 안내 도크 */
:root{
  --ink:#26305C; --ink2:#5A6590; --line:#26305C;
  --wall:#D7EEFF; --wall2:#BFE2FF; --sky:#9FD3FF;
  --wood:#F3B563; --wood2:#DB8B3A; --wood3:#B86A24;
  --paper:#FFFFFF; --cream:#FFF8E6;
  --tomato:#FF6A3D; --tomato2:#D9471F;
  --cheese:#FFD045; --cheese2:#E8A800;
  --r1:#3A7BFF; --r1l:#E2ECFF; --r1d:#2456C9;
  --r2:#1DB86A; --r2l:#DDF7EA; --r2d:#12884C;
  --r3:#8C5CF6; --r3l:#EEE6FF; --r3d:#6638CF;
  --good:#1DB86A; --bad:#F0464E;
  --f-title:"HakgyoMong","HakgyoBareun","Malgun Gothic",sans-serif;
  --f-body:"HakgyoBareun","Malgun Gothic","Apple SD Gothic Neo",sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden}
body{word-break:keep-all;background:#8CC8F5;background-image:radial-gradient(circle at 20% 20%,#A9D8FA 0,transparent 40%),radial-gradient(circle at 80% 80%,#7DBEEF 0,transparent 45%);font-family:var(--f-body);color:var(--ink);-webkit-tap-highlight-color:transparent;user-select:none}
button{font-family:inherit;color:inherit;cursor:pointer}
img{-webkit-user-drag:none}

/* 고정 화면 */
.screen{position:absolute;left:50%;top:50%;width:1280px;height:800px;transform-origin:center;transform:translate(-50%,-50%) scale(var(--s,1));
  background:linear-gradient(var(--wall) 0,var(--wall) 100%);border-radius:28px;overflow:hidden;box-shadow:0 0 0 6px var(--line),0 24px 60px rgba(20,40,90,.35)}

/* 상단 바 */
.bar{position:absolute;inset:0 0 auto 0;height:84px;background:#fff;border-bottom:4px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 28px;z-index:20}
.brand{display:flex;align-items:center;gap:12px}
.brand svg{width:50px;height:50px}
.brand h1{margin:0;font-family:var(--f-title);font-weight:400;font-size:32px;letter-spacing:-.5px;color:var(--ink);text-shadow:2px 2px 0 #E4F1FF}
.brand h1 em{font-style:normal;color:var(--tomato)}
.path{display:flex;align-items:center}
.node{display:flex;align-items:center;gap:8px;background:#fff;border:3px solid var(--line);border-radius:999px;height:46px;padding:0 16px 0 6px;font-weight:700;font-size:17px;color:var(--ink2);transition:transform .15s,background .2s;box-shadow:0 4px 0 var(--line)}
.node b{display:grid;place-items:center;width:32px;height:32px;border-radius:50%;background:#E3EAF7;color:var(--ink2);font-size:16px;border:2px solid var(--line)}
.node:hover{transform:translateY(-3px)}
.node.on{background:var(--tomato);color:#fff}
.node.on b{background:#fff;color:var(--tomato2)}
.node.done b{background:var(--good);color:#fff}
.link{width:22px;height:6px;background:repeating-linear-gradient(90deg,var(--line) 0 6px,transparent 6px 10px);margin:0 2px}

/* 장면 */
.scene{position:absolute;left:0;right:0;top:84px;height:556px;overflow:hidden}
.wallart{position:absolute;inset:0;background:
  radial-gradient(circle at 8% 22%,rgba(255,255,255,.7) 0 34px,transparent 35px),
  radial-gradient(circle at 92% 30%,rgba(255,255,255,.6) 0 46px,transparent 47px),
  linear-gradient(var(--wall) 0 64%,var(--wall2) 64% 100%)}
.bunting{position:absolute;left:0;right:0;top:0;height:40px;background:
  conic-gradient(from 150deg at 50% 0,var(--cheese) 0 60deg,transparent 0) 0 0/80px 40px,
  conic-gradient(from 150deg at 50% 0,var(--tomato) 0 60deg,transparent 0) 40px 0/80px 40px;opacity:.85}
.title{position:absolute;left:28px;top:54px;display:flex;align-items:center;gap:12px;z-index:6}
.title.mid{left:640px;top:50px;transform:translateX(-50%);flex-direction:column;gap:4px;text-align:center}
.title.mid h2{font-size:24px;white-space:nowrap}
.title .tag{background:var(--ink);color:#fff;font-weight:700;font-size:16px;border-radius:10px;padding:5px 12px}
.title h2{margin:0;font-size:28px;font-weight:700;color:var(--ink);text-shadow:0 2px 0 #fff}

/* 식탁 */
.table{position:absolute;left:30px;right:30px;top:372px;bottom:-20px;background:linear-gradient(var(--wood) 0 20px,#E9A653 20px);border:4px solid var(--line);border-radius:40px 40px 0 0;z-index:3;box-shadow:inset 0 -30px 0 var(--wood2)}
.table::before{content:"";position:absolute;left:0;right:0;top:20px;height:4px;background:var(--wood3);opacity:.5}

.kid{position:absolute;top:0;width:250px;height:556px;z-index:2;transform:translateX(-50%)}
.kid .body{position:absolute;left:50%;top:150px;width:220px;transform:translateX(-50%);transition:transform .25s}
.kid .body img{width:220px;height:auto;display:block;filter:drop-shadow(0 4px 0 rgba(38,48,92,.18))}
.kid:hover .body{transform:translateX(-50%) translateY(-6px)}
.kid .body.bump{animation:hop .45s}
@keyframes hop{30%{transform:translateX(-50%) translateY(-18px)}60%{transform:translateX(-50%) translateY(0)}80%{transform:translateX(-50%) translateY(-5px)}}
.info{position:absolute;width:290px;transform:translateX(-50%);top:382px;z-index:5;display:flex;flex-direction:column;align-items:center;gap:6px}
.plate{width:220px;height:56px;border-radius:50%;background:radial-gradient(ellipse at 50% 45%,#fff 0 55%,#EEF3FA 56% 100%);border:3px solid var(--line);display:flex;align-items:center;justify-content:center;gap:0;padding:0 18px;box-shadow:0 5px 0 rgba(38,48,92,.25)}
.plate img{width:30px;height:32px;object-fit:contain;margin:0 -4px;animation:drop .35s both}
@keyframes drop{from{transform:translateY(-30px) scale(.4);opacity:0}}
.tagline{display:flex;align-items:center;gap:8px}
.name{background:#fff;border:3px solid var(--line);border-radius:14px;padding:3px 14px;font-weight:700;font-size:20px;box-shadow:0 4px 0 var(--line)}
.cnt{background:var(--ink);color:#fff;border-radius:14px;padding:4px 12px;font-weight:700;font-size:18px;font-variant-numeric:tabular-nums;min-width:74px;text-align:center}
.cnt b{font-size:22px}
.badges{display:flex;gap:4px;min-height:34px;flex-wrap:nowrap;justify-content:center}
.bd{display:inline-flex;align-items:center;gap:3px;height:32px;padding:0 10px 0 4px;border-radius:999px;border:3px solid var(--line);font-weight:700;font-size:14px;white-space:nowrap;background:#fff;animation:pop .4s both;transition:transform .2s,box-shadow .2s}
.bd img{width:22px;height:22px;object-fit:contain}
.intro .bd{height:40px;font-size:17px;padding:0 14px 0 6px}.intro .bd img{width:28px;height:28px}
.bd.r1{background:var(--r1l);color:var(--r1d)}.bd.r2{background:var(--r2l);color:var(--r2d)}.bd.r3{background:var(--r3l);color:var(--r3d)}
.bd.glow{transform:scale(1.15) rotate(-3deg)}
.bd.r1.glow{background:var(--r1);color:#fff}.bd.r2.glow{background:var(--r2);color:#fff}.bd.r3.glow{background:var(--r3);color:#fff}
@keyframes pop{from{transform:scale(.3);opacity:0}70%{transform:scale(1.1)}to{transform:none;opacity:1}}

.say{position:absolute;left:50%;top:44px;margin-left:-130px;width:260px;transform-origin:50% 100%;background:#fff;border:4px solid var(--line);border-radius:22px;padding:12px 14px;font-weight:700;font-size:19px;line-height:1.35;text-align:center;z-index:8;display:none;box-shadow:0 5px 0 var(--line)}
.say::after{content:"";position:absolute;left:50%;bottom:-17px;width:24px;height:24px;background:#fff;border-right:4px solid var(--line);border-bottom:4px solid var(--line);transform:translateX(-50%) rotate(45deg);border-radius:0 0 6px 0}
.say.on{display:block;animation:sayPop .35s both}
@keyframes sayPop{from{transform:scale(.4) translateY(20px);opacity:0}70%{transform:scale(1.06)}to{transform:none;opacity:1}}

/* 피자 */
.pz{position:absolute;left:640px;top:150px;width:270px;transform:translateX(-50%);z-index:4;text-align:center}
.stand{width:290px;height:290px;margin-left:-10px;border-radius:50%;background:#fff;border:4px solid var(--line);box-shadow:0 8px 0 rgba(38,48,92,.3);display:grid;place-items:center}
.pz svg{width:262px;height:262px;display:block}
.slice{transition:transform .35s,opacity .35s;transform-origin:130px 130px}
.slice.gone{opacity:0;transform:scale(.5)}
.left{display:inline-block;margin-top:14px;background:var(--cheese);border:3px solid var(--line);border-radius:14px;padding:4px 14px;font-weight:700;font-size:17px;box-shadow:0 4px 0 var(--line);position:relative;z-index:5}
.fly{position:absolute;width:44px;height:46px;z-index:30;pointer-events:none;transition:transform .45s cubic-bezier(.3,1.3,.5,1),opacity .2s}

.stamp{position:absolute;left:640px;top:250px;transform:translate(-50%,-50%) rotate(-12deg) scale(2);opacity:0;z-index:12;font-family:var(--f-title);font-size:56px;padding:6px 26px;border:7px solid currentColor;border-radius:20px;background:rgba(255,255,255,.92);transition:transform .35s cubic-bezier(.3,1.6,.5,1),opacity .2s;pointer-events:none}
.stamp.show{opacity:1;transform:translate(-50%,-50%) rotate(-12deg) scale(1)}
.stamp.bad{color:var(--bad)}.stamp.good{color:var(--good)}

/* 시작 화면 */
.intro{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;gap:30px;padding:30px 50px 0}
.intro .pic{width:640px;background:#fff;border:4px solid var(--line);border-radius:30px;padding:14px;box-shadow:0 8px 0 var(--line);transform:rotate(-1.5deg);transition:transform .3s}
.intro .pic:hover{transform:rotate(0) scale(1.02)}
.intro .pic img{width:100%;display:block;border-radius:18px;background:var(--cream)}
.intro .txt{width:460px;display:flex;flex-direction:column;gap:18px}
.intro .kicker{align-self:flex-start;background:var(--ink);color:#fff;border-radius:12px;padding:6px 14px;font-weight:700;font-size:17px}
.intro h2{margin:0;font-family:var(--f-title);font-weight:400;font-size:58px;line-height:1.12;color:var(--ink);text-shadow:3px 3px 0 #fff}
.intro h2 em{font-style:normal;color:var(--tomato)}
.intro p{margin:0;font-size:21px;font-weight:700;color:var(--ink2)}
.legend{display:flex;gap:8px}

/* 카드 */
.cards{position:absolute;left:60px;right:60px;top:110px;display:grid;grid-template-columns:repeat(3,1fr);gap:28px}
.card3{border:0;background:none;padding:0;perspective:1200px;height:380px;text-align:left}
.card3 .inner{position:relative;height:100%;transition:transform .6s cubic-bezier(.3,1.3,.5,1);transform-style:preserve-3d}
.card3.open .inner{transform:rotateY(180deg)}
.card3:hover:not(.open) .inner{transform:translateY(-8px) rotate(-1deg)}
.card3 .side{position:absolute;inset:0;border:4px solid var(--line);border-radius:28px;backface-visibility:hidden;box-shadow:0 8px 0 var(--line);overflow:hidden}
.card3 .front{background:var(--cl);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px}
.card3 .front .ic{width:150px;height:150px;border-radius:50%;background:#fff;border:4px solid var(--line);display:grid;place-items:center;box-shadow:0 6px 0 var(--c)}
.card3 .front .ic img{width:96px;height:96px;object-fit:contain}
.card3 .front strong{font-family:var(--f-title);font-weight:400;font-size:46px;color:var(--cd)}
.card3 .front small{font-size:17px;font-weight:700;color:var(--ink2);background:#fff;border:3px solid var(--line);border-radius:999px;padding:4px 14px}
.card3 .back{transform:rotateY(180deg);background:var(--c);color:#fff;display:flex;flex-direction:column}
.card3 .back .pl{height:190px;background:#fff;border-bottom:4px solid var(--line);display:grid;place-items:center}
.card3 .back .pl img{max-height:176px;max-width:92%;object-fit:contain}
.card3 .back .bt{padding:14px 20px;display:flex;flex-direction:column;gap:4px}
.card3 .back .from{font-size:15px;font-weight:700;opacity:.9}
.card3 .back strong{font-family:var(--f-title);font-weight:400;font-size:44px;line-height:1.05}
.card3 .back p{margin:0;font-size:21px;font-weight:700}
.card3 .back span.ex{font-size:16px;font-weight:700;opacity:.92}
.c1{--c:var(--r1);--cl:var(--r1l);--cd:var(--r1d)}.c2{--c:var(--r2);--cl:var(--r2l);--cd:var(--r2d)}.c3{--c:var(--r3);--cl:var(--r3l);--cd:var(--r3d)}
.watch{position:absolute;left:0;right:0;top:516px;text-align:center;font-weight:700;font-size:19px;color:var(--ink);opacity:0;transform:translateY(8px);transition:.4s}
.watch.on{opacity:1;transform:none}
.watch b{display:inline-block;background:#fff;border:3px solid var(--line);border-radius:999px;padding:4px 16px;box-shadow:0 4px 0 var(--line)}

/* 퀴즈 */
.quiz{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;padding-top:100px;gap:26px}
.board{width:900px;background:#2F6B55;border:8px solid #A4652B;border-radius:24px;padding:24px 30px;text-align:center;color:#fff;box-shadow:0 8px 0 var(--line),inset 0 0 0 3px rgba(255,255,255,.15);position:relative}
.board .qn{font-size:18px;font-weight:700;color:var(--cheese)}
.board p{margin:6px 0 0;font-size:36px;font-weight:700;text-wrap:balance}
.dots{position:absolute;right:20px;top:16px;display:flex;gap:6px}
.dots i{width:14px;height:14px;border-radius:50%;background:rgba(255,255,255,.3)}
.dots i.ok{background:var(--good)}.dots i.cur{background:var(--cheese)}
.opts{display:flex;gap:28px}
.opt{width:240px;height:200px;border:4px solid var(--line);border-radius:28px;background:var(--cl,#fff);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;font-size:30px;font-weight:700;color:var(--cd,var(--ink));box-shadow:0 8px 0 var(--line);transition:transform .12s,box-shadow .12s}
.opt img{width:92px;height:92px;object-fit:contain}
.opt:hover{transform:translateY(-5px);box-shadow:0 13px 0 var(--line)}
.opt:active{transform:translateY(5px);box-shadow:0 3px 0 var(--line)}
.opt.plain{width:380px;height:150px;font-size:28px}
.opt.right{background:var(--good);color:#fff}
.opt.wrong{animation:shake .4s;background:#FFE4E5}
.opt[disabled]{cursor:default}
@keyframes shake{20%,60%{transform:translateX(-10px)}40%,80%{transform:translateX(10px)}}

/* 완료 */
.finish{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;gap:50px;padding:40px 60px 0 90px}
.finish .pic{position:relative;width:580px}
.finish .pic img.cheer{width:100%;display:block}
.finish .pic img.badge{position:absolute;left:-40px;top:-50px;width:150px;animation:pop .6s .2s both}
.finish .txt{width:440px;display:flex;flex-direction:column;gap:16px}
.finish h3{margin:0;font-family:var(--f-title);font-weight:400;font-size:50px;line-height:1.15;text-shadow:3px 3px 0 #fff}
.finish .score{align-self:flex-start;background:#fff;border:4px solid var(--line);border-radius:20px;padding:10px 20px;font-size:24px;font-weight:700;box-shadow:0 6px 0 var(--line)}
.finish .score b{color:var(--tomato);font-size:34px}
.sum{display:flex;flex-direction:column;gap:8px}
.sum span{display:flex;align-items:center;gap:10px;font-size:21px;font-weight:700}
.sum img{width:36px;height:36px;object-fit:contain;background:#fff;border:3px solid var(--line);border-radius:50%;padding:3px}
.again{align-self:flex-start;border:4px solid var(--line);background:#fff;border-radius:18px;padding:10px 20px;font-size:20px;font-weight:700;box-shadow:0 5px 0 var(--line)}
.again:hover{transform:translateY(-3px)}

/* 하단 도크 */
.dock{position:absolute;left:0;right:0;bottom:0;height:160px;background:#fff;border-top:4px solid var(--line);z-index:15}
.guide{position:absolute;left:22px;bottom:-4px;width:128px;z-index:16;transform-origin:bottom center;animation:bob 3s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-6px) rotate(-1.5deg)}}
.bubble{position:absolute;left:172px;right:250px;top:22px;bottom:22px;background:var(--cream);border:4px solid var(--line);border-radius:26px;padding:0 26px;display:flex;flex-direction:column;justify-content:center;z-index:16}
.bubble::before{content:"";position:absolute;left:-16px;top:46px;width:24px;height:24px;background:var(--cream);border-left:4px solid var(--line);border-bottom:4px solid var(--line);transform:rotate(45deg);border-radius:0 0 0 6px}
.bubble .who{font-size:15px;font-weight:700;color:var(--tomato2)}
.bubble .txt{font-size:25px;font-weight:700;line-height:1.35;animation:type .35s both}
@keyframes type{from{opacity:0;transform:translateY(6px)}}
.next{position:absolute;right:26px;top:30px;bottom:34px;width:200px;border:4px solid var(--line);border-radius:26px;background:var(--tomato);color:#fff;font-size:30px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:6px;box-shadow:0 8px 0 var(--line);transition:transform .1s,box-shadow .1s,filter .2s;z-index:16}
.next:hover{transform:translateY(-3px);box-shadow:0 11px 0 var(--line)}
.next:active{transform:translateY(6px);box-shadow:0 2px 0 var(--line)}
.next[disabled]{filter:grayscale(.85) brightness(1.15);cursor:default;transform:none;box-shadow:0 8px 0 var(--line)}
.next:not([disabled]){animation:nudge 2.2s ease-in-out infinite}
@keyframes nudge{0%,80%,100%{transform:none}88%{transform:translateX(5px)}94%{transform:translateX(-2px)}}
.credit{position:absolute;right:30px;bottom:6px;font-size:11px;color:var(--ink2);z-index:16}
:focus-visible{outline:4px solid var(--cheese);outline-offset:3px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="screen" id="screen">
  <header class="bar">
    <div class="brand">
      <svg viewBox="0 0 48 48" aria-hidden="true"><circle cx="24" cy="24" r="22" fill="#F3B563" stroke="#26305C" stroke-width="3"/><path d="M24 24 L24 5 A19 19 0 0 1 40.5 33.5Z" fill="#3A7BFF"/><path d="M24 24 L40.5 33.5 A19 19 0 0 1 7.5 33.5Z" fill="#1DB86A"/><path d="M24 24 L7.5 33.5 A19 19 0 0 1 24 5Z" fill="#8C5CF6"/><circle cx="24" cy="24" r="5" fill="#fff" stroke="#26305C" stroke-width="2.5"/></svg>
      <h1>피자로 배우는 <em>삼권분립</em></h1>
    </div>
    <nav class="path" id="steps" aria-label="단계"></nav>
  </header>

  <main class="scene" id="stage"></main>

  <footer class="dock">
    <img class="guide" src="/*YERAM*/" alt="예람쌤">
    <div class="bubble" aria-live="polite"><span class="who">예람쌤</span><span class="txt" id="gtxt"></span></div>
    <button class="next" id="next" type="button">다음 <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg></button>
    <span class="credit">만든 사람 김예람 (부천북초등학교)</span>
  </footer>
</div>

<script>
const IC={r1:'{{IMG:icon_role_decide}}',r2:'{{IMG:icon_role_share}}',r3:'{{IMG:icon_role_check}}'};
const ROLE={r1:'정해요',r2:'나눠요',r3:'확인해요'};
const PIZZA='{{IMG:pizza_whole}}', SLICE='{{IMG:pizza_slice}}';
const FACE={haneul:['{{IMG:kid_haneul_basic}}','{{IMG:kid_haneul_happy}}','{{IMG:kid_haneul_sad}}'],bada:['{{IMG:kid_bada_basic}}','{{IMG:kid_bada_happy}}','{{IMG:kid_bada_sad}}'],byeol:['{{IMG:kid_byeol_basic}}','{{IMG:kid_byeol_happy}}','{{IMG:kid_byeol_sad}}'],sol:['{{IMG:kid_sol_basic}}','{{IMG:kid_sol_happy}}','{{IMG:kid_sol_sad}}']};
const KIDS=[{id:'a',name:'하늘',img:'haneul',x:150},{id:'b',name:'바다',img:'bada',x:380},{id:'c',name:'별',img:'byeol',x:900},{id:'d',name:'솔',img:'sol',x:1130}];
const $=s=>document.querySelector(s);
const wait=ms=>new Promise(r=>setTimeout(r,ms));
const stage=$('#stage'),gtxt=$('#gtxt'),nextBtn=$('#next'),screenEl=$('#screen');
let scene=0, step=0, busy=false, done=new Set();

function fit(){const s=Math.min(innerWidth/1292,innerHeight/812);screenEl.style.setProperty('--s',s)}
addEventListener('resize',fit);fit();

function say(t){gtxt.textContent=t;gtxt.style.animation='none';void gtxt.offsetWidth;gtxt.style.animation=''}
const icon=(r,w)=>`<img src="${IC[r]}" alt="" ${w?`width="${w}"`:''}>`;
const bd=r=>`<span class="bd ${r}" data-r="${r}">${icon(r)}${ROLE[r]}</span>`;

function pizzaSVG(){
  let d='',g='';const R=127;
  for(let i=0;i<8;i++){
    const a1=(i*45-90)*Math.PI/180,a2=((i+1)*45-90)*Math.PI/180;
    d+=`<clipPath id="cp${i}"><path d="M130 130 L${(130+R*Math.cos(a1)).toFixed(1)} ${(130+R*Math.sin(a1)).toFixed(1)} A${R} ${R} 0 0 1 ${(130+R*Math.cos(a2)).toFixed(1)} ${(130+R*Math.sin(a2)).toFixed(1)}Z"/></clipPath>`;
    g+=`<g class="slice" data-i="${i}"><image href="${PIZZA}" x="4" y="4" width="252" height="252" clip-path="url(#cp${i})"/></g>`;
  }
  return `<svg viewBox="0 0 260 260" id="pizza" aria-label="피자 8조각"><defs>${d}</defs>${g}</svg>`;
}
function room(tag,title){
  return `<div class="wallart"></div><div class="bunting"></div><div class="title mid"><span class="tag">${tag}</span><h2>${title}</h2></div>
  ${KIDS.map(k=>`<div class="kid" id="k-${k.id}" style="left:${k.x}px">
     <div class="say" id="s-${k.id}"></div>
     <div class="body" id="bo-${k.id}"><img id="f-${k.id}" src="${FACE[k.img][0]}" alt="${k.name}"></div>
   </div>`).join('')}
  <div class="table"></div>
  ${KIDS.map(k=>`<div class="info" style="left:${k.x}px"><div class="plate" id="m-${k.id}"></div>
       <div class="tagline"><span class="name">${k.name}</span><span class="cnt"><b id="c-${k.id}">0</b>조각</span></div>
       <div class="badges" id="b-${k.id}"></div></div>`).join('')}
  <div class="pz"><div class="stand">${pizzaSVG()}</div><span class="left" id="left">남은 피자 8조각</span></div>
  <div class="stamp" id="stamp"></div>`;
}
function badge(kid,r){$('#b-'+kid).insertAdjacentHTML('beforeend',bd(r))}
function glow(r){document.querySelectorAll('.kid .bd').forEach(b=>b.classList.toggle('glow',b.dataset.r===r))}
function face(kid,m){const k=KIDS.find(x=>x.id===kid);$('#f-'+kid).src=FACE[k.img][m==='happy'?1:m==='sad'?2:0];const b=$('#bo-'+kid);b.classList.remove('bump');void b.offsetWidth;b.classList.add('bump')}
function talk(kid,t){
  document.querySelectorAll('.say').forEach(s=>s.classList.remove('on'));
  if(!kid)return;const s=$('#s-'+kid);s.textContent=t;s.classList.add('on');
}
function stamp(t,cls){const s=$('#stamp');s.textContent=t;s.className='stamp '+cls;requestAnimationFrame(()=>requestAnimationFrame(()=>s.classList.add('show')))}
let counts={};
function resetPizza(){
  counts={a:0,b:0,c:0,d:0};
  document.querySelectorAll('#pizza .slice').forEach(s=>s.classList.remove('gone'));
  KIDS.forEach(k=>{$('#m-'+k.id).innerHTML='';$('#c-'+k.id).textContent='0'});
  $('#left').textContent='남은 피자 8조각';const st=$('#stamp');if(st)st.className='stamp';
}
async function deal(plan){
  const order=[];const p={...plan};
  while(Object.values(p).some(v=>v>0)){for(const k of 'abcd'){if(p[k]>0){order.push(k);p[k]--}}}
  let i=0;
  for(const k of order){
    const kid=KIDS.find(x=>x.id===k);
    $(`#pizza .slice[data-i="${i}"]`).classList.add('gone');i++;
    const f=document.createElement('img');f.src=SLICE;f.className='fly';f.style.left='618px';f.style.top='272px';stage.appendChild(f);
    requestAnimationFrame(()=>{f.style.transform=`translate(${kid.x-640}px,${398-272}px) rotate(${k<'c'?-20:20}deg)`});
    await wait(380);f.remove();
    counts[k]++;$('#m-'+k).insertAdjacentHTML('beforeend',`<img src="${SLICE}" alt="">`);$('#c-'+k).textContent=counts[k];
    $('#left').textContent=`남은 피자 ${8-i}조각`;
    await wait(60);
  }
}

const SCENES=[
  {name:'시작',
   render(){stage.innerHTML=`<div class="wallart"></div><div class="bunting"></div><div class="intro">
     <div class="pic"><img src="{{IMG:intro_table}}" alt="친구 넷이 피자를 앞에 두고 고민하는 모습"></div>
     <div class="txt"><span class="kicker">초등 사회 · 삼권분립</span><h2>피자 한 판,<br>어떻게 나누면<br><em>공평할까?</em></h2><p>피자를 나누면서 나라의 일을 나누는 방법을 알아봐요.</p><div class="legend">${bd('r1')}${bd('r2')}${bd('r3')}</div></div></div>`},
   steps:[()=>say('안녕하세요! 오늘은 피자를 나누면서 공부해요. [다음]을 눌러 시작해요.')]},
  {name:'혼자 하면?',
   render(){stage.innerHTML=room('이야기 1','혼자 다 하면?');resetPizza()},
   steps:[
    ()=>say('친구 넷이 피자 한 판을 먹으려고 해요. 피자는 모두 8조각이에요.'),
    async()=>{say('하늘이가 "내가 다 할게!" 했어요. 정하기, 나누기, 확인하기를 모두 하늘이가 해요.');for(const r of['r1','r2','r3']){badge('a',r);await wait(320)}},
    ()=>{glow('r1');talk('a','규칙은 내가 정할게. 나는 5조각, 너희는 1조각씩!');say('하늘이가 나누는 규칙을 정했어요.')},
    async()=>{glow('r2');talk('a','내가 나눠 줄게!');say('하늘이가 피자를 나눠요.');await deal({a:5,b:1,c:1,d:1});face('a','happy');['b','c','d'].forEach(k=>face(k,'sad'))},
    ()=>{glow(null);talk('b','이건 불공평해!');say('바다가 불공평하다고 말했어요. 누가 확인해 줄까요?')},
    ()=>{glow('r3');talk('a','내가 확인했는데? 아무 문제 없어!');say('확인하는 사람도 하늘이라서 잘못을 고칠 수가 없어요.');stamp('불공평!','bad')},
    ()=>{glow(null);talk(null);say('한 사람이 정하고, 나누고, 확인까지 다 하면 자기에게만 좋게 할 수 있어요.')}
   ]},
  {name:'나눠 맡으면?',
   render(){stage.innerHTML=room('이야기 2','셋이 나눠 맡으면?');resetPizza()},
   steps:[
    ()=>say('이번에는 할 일을 셋으로 나눠요. 다시 피자 8조각으로 시작해요.'),
    async()=>{say('바다는 정하고, 별이는 나누고, 솔이는 확인해요. 한 사람이 한 가지씩만 맡아요.');badge('b','r1');await wait(320);badge('c','r2');await wait(320);badge('d','r3')},
    ()=>{glow('r1');talk('b','모두 똑같이 2조각씩!');say('바다가 규칙을 정했어요. 한 사람에 2조각씩이에요.')},
    async()=>{glow('r2');talk('c','헤헤, 나는 조금 더 가져야지.');say('어? 나누는 별이가 몰래 더 가져가요!');await deal({a:2,b:1,c:4,d:1});face('c','happy');face('b','sad');face('d','sad')},
    ()=>{glow('r3');talk('d','잠깐! 정한 규칙이랑 달라요. 다시 나눠 주세요.');say('확인하는 솔이가 잘못을 찾아냈어요.')},
    async()=>{glow('r2');talk('c','알았어, 규칙대로 다시 나눌게.');say('별이가 규칙대로 다시 나눠요.');resetPizza();KIDS.forEach(k=>face(k.id,'basic'));await wait(300);await deal({a:2,b:2,c:2,d:2});KIDS.forEach(k=>face(k.id,'happy'));stamp('공평!','good')},
    ()=>{glow(null);talk(null);say('일을 나눠 맡고 서로 지켜보니까 모두 공평하게 먹었어요. 나라도 이렇게 일을 셋으로 나눠요.')}
   ]},
  {name:'진짜 나라',
   render(){
    const PL=['{{IMG:place_gukhoe}}','{{IMG:place_jeongbu}}','{{IMG:place_beobwon}}'];
    const C=[['c1','r1','정해요','국회','법을 만들어요','국회의원이 모여서 나라의 규칙을 정해요.'],
             ['c2','r2','나눠요','정부','법대로 나라 일을 해요','대통령과 장관이 학교를 짓고 길을 만들어요.'],
             ['c3','r3','확인해요','법원','법을 지켰는지 판단해요','판사가 재판을 해서 잘잘못을 가려요.']];
    stage.innerHTML=`<div class="wallart"></div><div class="bunting"></div><div class="title"><span class="tag">알아보기</span><h2>진짜 나라에서는 누가 할까?</h2></div>
     <div class="cards">${C.map((c,i)=>`<button type="button" class="card3 ${c[0]}" data-i="${i}" aria-label="${c[2]} 카드 뒤집기"><div class="inner">
      <div class="side front"><span class="ic">${icon(c[1])}</span><strong>${c[2]}</strong><small>눌러서 뒤집기</small></div>
      <div class="side back"><div class="pl"><img src="${PL[i]}" alt="${c[3]}"></div><div class="bt"><span class="from">피자 나누기의 '${c[2]}'</span><strong>${c[3]}</strong><p>${c[4]}</p><span class="ex">${c[5]}</span></div></div>
     </div></button>`).join('')}</div>
     <div class="watch" id="watch"><b>국회 · 정부 · 법원은 서로 지켜보며 한 곳만 힘이 세지지 않게 해요</b></div>`;
    const opened=new Set();
    stage.querySelectorAll('.card3').forEach(b=>b.addEventListener('click',()=>{
      b.classList.toggle('open');opened.add(b.dataset.i);
      const t=['정하는 일은 국회가 해요. 국회는 법을 만들어요.','나누는 일은 정부가 해요. 정부는 법대로 나라 일을 해요.','확인하는 일은 법원이 해요. 법원은 법을 지켰는지 판단해요.'][b.dataset.i];
      say(opened.size===3?t+' 다 봤으면 [다음]을 눌러요.':t);
      if(opened.size===3){$('#watch').classList.add('on');nextBtn.disabled=false}
    }));
   },
   steps:[()=>{say('피자 나누기에서 맡았던 일을 진짜 나라에서는 누가 할까요? 카드 세 장을 눌러 보세요.');return 'lock'}]},
  {name:'퀴즈',render(){quizStart()},steps:[()=>'lock']}
];

const Q=[
  {q:'새로운 법을 만들어요.',a:0,why:'법을 만드는 곳은 국회예요.'},
  {q:'법에 따라 학교를 짓고 길을 만들어요.',a:1,why:'법대로 나라 일을 하는 곳은 정부예요.'},
  {q:'법을 어겼는지 재판해요.',a:2,why:'재판을 하는 곳은 법원이에요.'},
  {q:'피자 나누기에서 "확인하는 친구"는 어디와 닮았을까요?',a:2,why:'규칙대로 했는지 확인하는 건 법원과 닮았어요.'},
  {q:'한 사람이 법도 만들고, 나라 일도 하고, 재판까지 하면?',plain:['모두 공평해져요','불공평해질 수 있어요'],a:1,why:'하늘이처럼 자기에게만 좋게 할 수 있어서 일을 나눠 맡아요.'}
];
let qi=0,score=0,tries=0;
function quizStart(){qi=0;score=0;showQ()}
function showQ(){
  tries=0;const q=Q[qi];
  const dots=Q.map((_,i)=>`<i class="${i<qi?'ok':i===qi?'cur':''}"></i>`).join('');
  const opts=q.plain? q.plain.map((t,i)=>`<button type="button" class="opt plain" data-i="${i}">${t}</button>`).join('')
    : [['c1','r1','국회'],['c2','r2','정부'],['c3','r3','법원']].map((o,i)=>`<button type="button" class="opt ${o[0]}" data-i="${i}">${icon(o[1])}${o[2]}</button>`).join('');
  stage.innerHTML=`<div class="wallart"></div><div class="bunting"></div><div class="title"><span class="tag">퀴즈</span><h2>누가 하는 일일까?</h2></div>
   <div class="quiz"><div class="board"><div class="dots">${dots}</div><span class="qn">${qi+1}번 문제</span><p>${q.q}</p></div><div class="opts">${opts}</div></div>`;
  say('알맞은 답을 눌러 보세요.');nextBtn.disabled=true;
  stage.querySelectorAll('.opt').forEach(b=>b.addEventListener('click',()=>{
    if(+b.dataset.i===q.a){
      if(tries===0)score++;
      b.classList.add('right');stage.querySelectorAll('.opt').forEach(x=>x.disabled=true);
      say('맞았어요! '+q.why);nextBtn.disabled=false;
    }else{tries++;b.classList.remove('wrong');void b.offsetWidth;b.classList.add('wrong');say('다시 생각해 봐요. 피자 나누기를 떠올려 보세요.')}
  }));
}
function finish(){
  stage.innerHTML=`<div class="wallart"></div><div class="bunting"></div><div class="finish">
   <div class="pic"><img class="cheer" src="{{IMG:finish_cheer}}" alt="피자를 똑같이 나눠 들고 웃는 친구들"><img class="badge" src="{{IMG:badge_complete}}" alt="완료 메달"></div>
   <div class="txt"><h3>삼권분립<br>이해 완료!</h3><div class="score">한 번에 맞힌 문제 <b>${score}</b> / ${Q.length}</div>
    <div class="sum"><span>${icon('r1')}국회는 법을 만들어요</span><span>${icon('r2')}정부는 법대로 일해요</span><span>${icon('r3')}법원은 법을 지켰는지 판단해요</span></div>
    <button type="button" class="again" id="again">처음부터 다시</button></div></div>`;
  say('잘했어요! 나라의 일을 나눠 맡고 서로 지켜보는 것, 이것이 삼권분립이에요.');
  done.add(4);drawSteps();nextBtn.disabled=true;
  $('#again').addEventListener('click',()=>{done.clear();go(0)});
}

function drawSteps(){
  $('#steps').innerHTML=SCENES.map((s,i)=>`${i?'<span class="link"></span>':''}<button type="button" class="node ${i===scene?'on':''} ${done.has(i)?'done':''}" data-i="${i}"><b>${done.has(i)&&i!==scene?'✓':i+1}</b>${s.name}</button>`).join('');
  $('#steps').querySelectorAll('.node').forEach(b=>b.addEventListener('click',()=>{if(!busy)go(+b.dataset.i)}));
}
async function run(){
  busy=true;nextBtn.disabled=true;
  const r=await SCENES[scene].steps[step]();
  busy=false;if(r!=='lock')nextBtn.disabled=false;
}
function go(i){scene=i;step=0;SCENES[i].render();drawSteps();run()}
nextBtn.addEventListener('click',()=>{
  if(busy)return;
  if(scene===4){if(qi<Q.length-1){qi++;showQ()}else finish();return}
  if(step<SCENES[scene].steps.length-1){step++;run()}
  else{done.add(scene);go(scene+1)}
});
go(0);
</script>
</body>
</html>
