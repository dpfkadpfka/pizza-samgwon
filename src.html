<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="icon" type="image/png" href="favicon.png?v=yr1"><title>피자로 배우는 삼권분립</title>
<style>
/*FONTS*/
/* 콘셉트: 동네 피자집. 1280×800 고정 화면(가로 태블릿)을 기기에 맞춰 확대·축소.
   구조: 맨 위 얇은 줄무늬 차양 → 헤더(로고·단계) → 장면(크림 바탕, 체크 식탁보, 나무 도마) → 아래 안내 바.
   원칙: 빨강은 행동·강조에만, 바탕은 크림/종이, 그림자는 한 종류, 모서리는 16/24 두 단계. */
:root{
  --cream:#FBF3E6; --cream2:#F4E7D3; --paper:#FFFDF9; --line:#EBDDC9;
  --tomato:#D93A2B; --tomato2:#B42A1D; --tomatol:#FCE7E3;
  --crust:#C0844A; --crust2:#9A6332; --crust3:#6E431F;
  --basil:#2E8B57; --basill:#E3F3EA;
  --ink:#2A1A12; --ink2:#6F5747; --ink3:#A99381;
  --r1:#3C6FD8; --r1l:#E9EFFC; --r1d:#2B55B0;
  --r2:#2E8B57; --r2l:#E3F3EA; --r2d:#1F6B41;
  --r3:#7C52C9; --r3l:#F0EAFA; --r3d:#5D38A6;
  --sh:0 1px 0 rgba(110,67,31,.06),0 8px 24px rgba(110,67,31,.12);
  --shb:0 2px 0 rgba(110,67,31,.08),0 18px 40px rgba(110,67,31,.18);
  --f-title:"Hyejaroun","HakgyoKossuyeom","HakgyoBareun",sans-serif;
  --f-body:"Freesentation","HakgyoBareun","Malgun Gothic","Apple SD Gothic Neo",sans-serif;
  --f-talk:"CuteHand","HakgyoBareun",sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden}
body{word-break:keep-all;background:#E9DCC7;font-family:var(--f-body);color:var(--ink);-webkit-tap-highlight-color:transparent;user-select:none}
button{font-family:inherit;color:inherit;cursor:pointer;border:0;background:none}
img{-webkit-user-drag:none}
.screen{position:absolute;left:50%;top:50%;width:1280px;height:800px;transform-origin:center;transform:translate(-50%,-50%) scale(var(--s,1));background:var(--cream);border-radius:28px;overflow:hidden;box-shadow:0 24px 70px rgba(110,67,31,.28)}

/* ── 헤더 ───────────────────────── */
.bar{position:absolute;inset:0 0 auto 0;height:96px;z-index:20;display:flex;align-items:flex-end;justify-content:space-between;padding:0 28px 12px}
.bar::before{content:"";position:absolute;left:0;right:0;top:0;height:22px;background:repeating-linear-gradient(90deg,var(--tomato) 0 40px,#fff 40px 80px)}
.bar::after{content:"";position:absolute;left:0;right:0;top:22px;height:10px;background:radial-gradient(circle at 20px 0,var(--tomato) 19px,transparent 20px) 0 0/80px 10px,radial-gradient(circle at 60px 0,#fff 19px,transparent 20px) 0 0/80px 10px}
.brand{display:flex;align-items:center;gap:10px}
.brand img{width:34px!important;height:36px!important}
.brand h1{margin:0;font-family:var(--f-title);font-weight:400;font-size:26px;color:var(--ink);letter-spacing:-.2px}
.brand h1 em{font-style:normal;color:var(--tomato)}
.right{display:flex;align-items:center;gap:14px}
.path{display:flex;align-items:center;gap:2px;background:var(--paper);padding:4px;border-radius:999px;box-shadow:var(--sh)}
.node{display:flex;align-items:center;gap:7px;height:38px;padding:0 14px 0 6px;border-radius:999px;font-weight:700;font-size:15px;color:var(--ink2);transition:background .2s,color .2s}
.node b{display:grid;place-items:center;width:26px;height:26px;border-radius:50%;background:var(--cream2);color:var(--ink2);font-size:13px}
.node:hover{background:var(--cream)}
.node.on{background:var(--tomato);color:#fff}
.node.on b{background:#fff;color:var(--tomato)}
.node.done b{background:var(--basil);color:#fff}
.link{display:none}
.logo{width:46px;height:46px;object-fit:contain;display:block}

/* ── 장면 공통 ───────────────────── */
.scene{position:absolute;left:0;right:0;top:96px;height:556px;overflow:hidden}
.wallart{position:absolute;inset:0;background:radial-gradient(900px 420px at 50% 18%,#FFF9EF,transparent 70%),
  repeating-linear-gradient(0deg,transparent 0 47px,rgba(192,132,74,.10) 47px 48px),repeating-linear-gradient(90deg,transparent 0 47px,rgba(192,132,74,.10) 47px 48px)}
.bunting{display:none}
.title{position:absolute;left:640px;top:12px;transform:translateX(-50%);z-index:6;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}
.title .tag{background:var(--tomato);color:#fff;font-weight:700;font-size:13px;border-radius:999px;padding:4px 12px;letter-spacing:.5px}
.title h2{margin:0;font-family:var(--f-title);font-weight:400;font-size:32px;color:var(--ink);white-space:nowrap;filter:url(#stk-m)}

/* 식탁 */
.table{position:absolute;left:24px;right:24px;top:368px;height:200px;z-index:3;border-radius:24px 24px 0 0;
  background:linear-gradient(90deg,rgba(217,58,43,.16) 50%,transparent 50%) 0 0/40px 40px,linear-gradient(rgba(217,58,43,.16) 50%,transparent 50%) 0 0/40px 40px,var(--paper);
  box-shadow:inset 0 0 0 10px var(--paper),0 -6px 24px rgba(110,67,31,.12)}

.kid{position:absolute;top:0;width:250px;height:556px;z-index:2;transform:translateX(-50%)}
.kid .body{position:absolute;left:50%;top:154px;width:210px;transform:translateX(-50%);transition:transform .25s}
.kid .body img{width:210px;height:auto;display:block}
.kid:hover .body{transform:translateX(-50%) translateY(-6px)}
.kid .body.bump{animation:hop .45s}
@keyframes hop{30%{transform:translateX(-50%) translateY(-16px)}60%{transform:translateX(-50%) translateY(0)}80%{transform:translateX(-50%) translateY(-4px)}}
.info{position:absolute;width:290px;transform:translateX(-50%);top:384px;z-index:5;display:flex;flex-direction:column;align-items:center;gap:8px}
.plate{width:212px;height:58px;border-radius:50%;background:radial-gradient(ellipse at 50% 45%,#fff 0 56%,#F3ECE2 58% 100%);box-shadow:0 6px 14px rgba(110,67,31,.16);display:flex;align-items:center;justify-content:center;padding:0 18px}
.plate img{width:30px;height:32px;object-fit:contain;margin:0 -4px;animation:drop .35s both}
@keyframes drop{from{transform:translateY(-30px) scale(.4);opacity:0}}
.tagline{display:flex;align-items:center;gap:8px;background:var(--paper);border-radius:999px;padding:4px 4px 4px 14px;box-shadow:var(--sh)}
.name{font-family:var(--f-title);font-size:19px;color:var(--ink)}
.cnt{background:var(--tomato);color:#fff;border-radius:999px;padding:2px 10px;font-weight:700;font-size:14px;font-variant-numeric:tabular-nums;min-width:58px;text-align:center}
.cnt b{font-size:16px}
.badges{display:flex;gap:4px;min-height:30px;flex-wrap:nowrap;justify-content:center}
.bd{display:inline-flex;align-items:center;gap:3px;height:30px;padding:0 10px 0 4px;border-radius:999px;font-weight:700;font-size:14px;white-space:nowrap;background:var(--paper);box-shadow:var(--sh);animation:pop .4s both;transition:transform .2s,background .2s,color .2s}
.bd img{width:22px;height:22px;object-fit:contain}
.bd.r1{color:var(--r1d)}.bd.r2{color:var(--r2d)}.bd.r3{color:var(--r3d)}
.bd.glow{transform:scale(1.1)}
.bd.r1.glow{background:var(--r1);color:#fff}.bd.r2.glow{background:var(--r2);color:#fff}.bd.r3.glow{background:var(--r3);color:#fff}
@keyframes pop{from{transform:scale(.4);opacity:0}70%{transform:scale(1.06)}to{transform:none;opacity:1}}

.say{position:absolute;left:50%;top:50px;margin-left:-130px;width:260px;transform-origin:50% 100%;background:var(--paper);border-radius:20px;padding:10px 16px;text-align:center;z-index:8;display:none;box-shadow:var(--shb);font-family:var(--f-talk);font-size:32px;line-height:1.2;color:var(--ink)}
.say::after{content:"";position:absolute;left:50%;bottom:-8px;width:18px;height:18px;margin-left:-9px;background:var(--paper);transform:rotate(45deg);border-radius:3px}
.say.on{display:block;animation:sayPop .35s both}
@keyframes sayPop{from{transform:scale(.5) translateY(16px);opacity:0}70%{transform:scale(1.04)}to{transform:none;opacity:1}}

/* 피자: 나무 도마 */
.pz{position:absolute;left:640px;top:112px;width:296px;transform:translateX(-50%);z-index:4;text-align:center}
.stand{width:296px;height:296px;border-radius:50%;background:radial-gradient(circle,#D19A62 0 62%,var(--crust) 63% 100%);box-shadow:0 5px 0 var(--crust2),0 18px 30px rgba(110,67,31,.25);display:grid;place-items:center}
.pz svg{width:264px;height:264px;display:block}
.slice{transition:transform .35s,opacity .35s;transform-origin:130px 130px}
.slice.gone{opacity:0;transform:scale(.5)}
.left{display:inline-block;margin-top:14px;background:var(--paper);color:var(--ink2);border-radius:999px;padding:5px 14px;font-weight:700;font-size:14px;position:relative;z-index:5;box-shadow:var(--sh)}
.fly{position:absolute;width:44px;height:46px;z-index:30;pointer-events:none;transition:transform .45s cubic-bezier(.3,1.3,.5,1),opacity .2s}
.stamp{position:absolute;left:640px;top:260px;transform:translate(-50%,-50%) rotate(-10deg) scale(1.8);opacity:0;z-index:12;font-family:var(--f-title);font-size:48px;padding:6px 26px;border:5px solid currentColor;border-radius:14px;background:rgba(255,253,249,.95);transition:transform .35s cubic-bezier(.3,1.6,.5,1),opacity .2s;pointer-events:none;white-space:nowrap}
.stamp.show{opacity:1;transform:translate(-50%,-50%) rotate(-10deg) scale(1)}
.stamp.bad{color:var(--tomato)}.stamp.good{color:var(--basil)}

/* ── 시작 ───────────────────────── */
.intro{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;gap:56px;padding:0 64px}
.intro .pic{width:580px;background:var(--paper);padding:14px 14px 46px;box-shadow:var(--shb);transform:rotate(-2.5deg);transition:transform .3s;position:relative;border-radius:4px}
.intro .pic::before{content:"";position:absolute;left:50%;top:-12px;width:120px;height:26px;margin-left:-60px;background:rgba(217,58,43,.28);transform:rotate(2deg)}
.intro .pic::after{content:"오늘의 메뉴: 삼권분립 피자";position:absolute;left:0;right:0;bottom:6px;text-align:center;font-family:var(--f-talk);font-size:28px;color:var(--ink2)}
.intro .pic:hover{transform:rotate(-1deg) translateY(-4px)}
.intro .pic img{width:100%;display:block;border-radius:2px;background:var(--cream2)}
.intro .txt{width:470px;display:flex;flex-direction:column;gap:20px}
.intro .kicker{align-self:flex-start;background:var(--tomatol);color:var(--tomato2);border-radius:999px;padding:6px 14px;font-weight:700;font-size:14px;letter-spacing:.5px}
.intro h2{margin:0;font-family:var(--f-title);font-weight:400;font-size:56px;line-height:1.22;color:var(--ink);filter:url(#stk-l)}
.intro h2 em{font-style:normal;color:var(--tomato)}
.intro p{margin:0;font-size:19px;color:var(--ink2);line-height:1.55}
.legend{display:flex;gap:8px}
.intro .bd{height:38px;font-size:15px;padding:0 14px 0 6px}.intro .bd img{width:26px;height:26px}

/* ── 카드: 피자 상자 ─────────────── */
.cards{position:absolute;left:60px;right:60px;top:104px;display:grid;grid-template-columns:repeat(3,1fr);gap:28px}
.card3{padding:0;perspective:1200px;height:380px;text-align:left}
.card3 .inner{position:relative;height:100%;transition:transform .6s cubic-bezier(.3,1.2,.5,1);transform-style:preserve-3d}
.card3.open .inner{transform:rotateY(180deg)}
.card3:hover:not(.open) .inner{transform:translateY(-6px)}
.card3 .side{position:absolute;inset:0;border-radius:16px;backface-visibility:hidden;box-shadow:var(--shb);overflow:hidden}
.card3 .front{background:#E0B47F;background-image:repeating-linear-gradient(90deg,rgba(255,255,255,.06) 0 2px,transparent 2px 6px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px}
.card3 .front::before{content:"";position:absolute;inset:14px;border:2px dashed rgba(110,67,31,.28);border-radius:10px}
.card3 .front .ic{width:140px;height:140px;border-radius:50%;background:var(--paper);display:grid;place-items:center;box-shadow:0 0 0 7px var(--c)}
.card3 .front .ic img{width:86px;height:86px;object-fit:contain}
.card3 .front strong{font-family:var(--f-title);font-weight:400;font-size:34px;color:#fff;background:var(--c);padding:4px 20px;border-radius:999px}
.card3 .front small{font-size:14px;font-weight:700;color:var(--crust3)}
.card3 .back{transform:rotateY(180deg);background:var(--paper);display:flex;flex-direction:column}
.card3 .back .pl{height:190px;background:var(--cl);display:grid;place-items:center}
.card3 .back .pl img{max-height:176px;max-width:92%;object-fit:contain}
.card3 .back .bt{padding:16px 22px;display:flex;flex-direction:column;gap:6px}
.card3 .back .from{font-size:13px;font-weight:700;color:var(--c);letter-spacing:.3px}
.card3 .back strong{font-family:var(--f-title);font-weight:400;font-size:36px;line-height:1.05;color:var(--cd)}
.card3 .back p{margin:0;font-size:19px;font-weight:700;color:var(--ink)}
.card3 .back span.ex{font-size:15px;color:var(--ink2);line-height:1.5}
.c1{--c:var(--r1);--cl:var(--r1l);--cd:var(--r1d)}.c2{--c:var(--r2);--cl:var(--r2l);--cd:var(--r2d)}.c3{--c:var(--r3);--cl:var(--r3l);--cd:var(--r3d)}
.watch{position:absolute;left:0;right:0;top:504px;text-align:center;opacity:0;transform:translateY(8px);transition:.4s}
.watch.on{opacity:1;transform:none}
.watch b{display:inline-block;background:var(--ink);color:#fff;border-radius:999px;padding:8px 20px;font-size:16px}

/* ── 퀴즈: 주문서 ───────────────── */
.quiz{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;padding-top:104px;gap:30px}
.board{width:820px;background:var(--paper);padding:28px 40px 32px;text-align:center;box-shadow:var(--shb);position:relative;border-radius:6px 6px 0 0;
  -webkit-mask:radial-gradient(circle 8px at 12px 100%,transparent 98%,#000) 0 0/24px 100% repeat-x;mask:radial-gradient(circle 8px at 12px 100%,transparent 98%,#000) 0 0/24px 100% repeat-x}
.board::before{content:"주문서";position:absolute;left:24px;top:20px;font-weight:700;font-size:13px;color:var(--tomato);border:2px solid var(--tomato);padding:1px 9px;border-radius:6px}
.board .qn{font-size:14px;font-weight:700;color:var(--ink3);letter-spacing:.5px}
.board p{margin:10px 0 0;font-family:var(--f-title);font-size:36px;color:var(--ink);text-wrap:balance}
.dots{position:absolute;right:26px;top:24px;display:flex;gap:6px}
.dots i{width:9px;height:9px;border-radius:50%;background:var(--line)}
.dots i.ok{background:var(--basil)}.dots i.cur{background:var(--tomato);width:22px;border-radius:999px}
.opts{display:flex;gap:30px}
.opt{width:200px;height:200px;border-radius:50%;background:radial-gradient(circle,#fff 0 60%,#F3ECE2 62% 100%);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;font-family:var(--f-title);font-size:28px;color:var(--cd,var(--ink));box-shadow:0 10px 24px rgba(110,67,31,.18);transition:transform .15s,box-shadow .15s}
.opt img{width:76px;height:76px;object-fit:contain}
.opt:hover{transform:translateY(-6px) rotate(-4deg);box-shadow:0 16px 30px rgba(110,67,31,.22)}
.opt:active{transform:translateY(2px)}
.opt.plain{width:360px;height:130px;border-radius:65px;font-size:24px}
.opt.right{background:radial-gradient(circle,#EAF7EF 0 60%,#CDEBD9 62% 100%);color:var(--basil)}
.opt.wrong{animation:shake .4s}
.opt[disabled]{cursor:default}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}

/* ── 완료: 영수증 ───────────────── */
.finish{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;gap:52px;padding:0 64px 0 84px}
.finish .pic{position:relative;width:540px;background:var(--paper);padding:20px 18px 14px;box-shadow:var(--shb);transform:rotate(-2deg);border-radius:4px}
.finish .pic img.cheer{width:100%;display:block}
.finish .pic img.badge{position:absolute;left:-34px;top:-40px;width:124px;animation:pop .6s .2s both}
.finish .txt{width:420px;display:flex;flex-direction:column;gap:14px;background:var(--paper);padding:28px 30px 36px;box-shadow:var(--shb);border-radius:6px 6px 0 0;
  -webkit-mask:radial-gradient(circle 8px at 12px 100%,transparent 98%,#000) 0 0/24px 100% repeat-x;mask:radial-gradient(circle 8px at 12px 100%,transparent 98%,#000) 0 0/24px 100% repeat-x}
.finish h3{margin:0;font-family:var(--f-title);font-weight:400;font-size:40px;line-height:1.15;color:var(--tomato)}
.finish .score{border-top:2px dashed var(--line);border-bottom:2px dashed var(--line);padding:12px 0;font-size:17px;font-weight:700;color:var(--ink2);display:flex;justify-content:space-between;align-items:baseline}
.finish .score b{color:var(--tomato);font-size:30px;font-family:var(--f-title);font-weight:400}
.sum{display:flex;flex-direction:column;gap:10px}
.sum span{display:flex;align-items:center;gap:12px;font-size:17px;font-weight:700}
.sum img{width:34px;height:34px;object-fit:contain;background:var(--cream);border-radius:50%;padding:4px}
.again{align-self:stretch;background:var(--tomato);border-radius:14px;padding:12px 22px;font-size:17px;font-weight:700;color:#fff;margin-top:6px}
.again:hover{background:var(--tomato2)}

/* ── 아래 안내 바 ───────────────── */
.dock{position:absolute;left:24px;right:24px;bottom:18px;height:118px;background:var(--paper);border-radius:24px;box-shadow:var(--shb);z-index:15}
.bubble{position:absolute;left:14px;right:214px;top:14px;bottom:14px;background:var(--cream);border-radius:16px;padding:0 26px;display:flex;flex-direction:column;justify-content:center;z-index:16}
.bubble .txt{font-family:var(--f-talk);font-size:40px;line-height:1.2;color:var(--ink);animation:type .35s both}
@keyframes type{from{opacity:0;transform:translateY(5px)}}
.next{position:absolute;right:14px;top:14px;bottom:14px;width:186px;border-radius:16px;background:var(--tomato);color:#fff;font-family:var(--f-title);font-size:28px;display:flex;align-items:center;justify-content:center;gap:6px;transition:transform .12s,background .2s;z-index:16}
.next:hover{background:var(--tomato2)}
.next:active{transform:scale(.97)}
.next[disabled]{background:var(--cream2);color:var(--ink3);cursor:default;transform:none}
.credit{position:absolute;right:30px;bottom:3px;font-size:10px;color:var(--ink3);z-index:16}
:focus-visible{outline:3px solid var(--tomato);outline-offset:3px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
<filter id="stk-m" x="-10%" y="-30%" width="120%" height="160%"><feMorphology in="SourceAlpha" operator="dilate" radius="4" result="d"/><feFlood flood-color="#fff"/><feComposite in2="d" operator="in" result="w"/><feMerge><feMergeNode in="w"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<filter id="stk-l" x="-10%" y="-30%" width="120%" height="160%"><feMorphology in="SourceAlpha" operator="dilate" radius="6" result="d"/><feFlood flood-color="#fff"/><feComposite in2="d" operator="in" result="w"/><feMerge><feMergeNode in="w"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs></svg>
<div class="screen" id="screen">
  <header class="bar">
    <div class="brand">
      <img src="{{IMG:pizza_slice}}" alt="" style="width:40px;height:42px;object-fit:contain">
      <h1>피자로 배우는 <em>삼권분립</em></h1>
    </div>
    <div class="right"><nav class="path" id="steps" aria-label="단계"></nav><img class="logo" src="{{IMG:logo_head}}" alt="예람쌤"></div>
  </header>

  <main class="scene" id="stage"></main>

  <footer class="dock">
    <div class="bubble" aria-live="polite"><span class="txt" id="gtxt"></span></div>
    <button class="next" id="next" type="button">다음 <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg></button>
  </footer>
  <span class="credit">만든 사람 김예람 (부천북초등학교)</span>
</div>

<script>
const IC={r1:'{{IMG:icon_role_decide}}',r2:'{{IMG:icon_role_share}}',r3:'{{IMG:icon_role_check}}'};
const ROLE={r1:'정해요',r2:'나눠요',r3:'확인해요'};
const PIZZA='{{IMG:pizza_whole}}', SLICE='{{IMG:pizza_slice}}';
const FACE={haneul:['{{IMG:kid_haneul_basic}}','{{IMG:kid_haneul_happy}}','{{IMG:kid_haneul_sad}}'],bada:['{{IMG:kid_bada_basic}}','{{IMG:kid_bada_happy}}','{{IMG:kid_bada_sad}}'],byeol:['{{IMG:kid_byeol_basic}}','{{IMG:kid_byeol_happy}}','{{IMG:kid_byeol_sad}}'],sol:['{{IMG:kid_sol_basic}}','{{IMG:kid_sol_happy}}','{{IMG:kid_sol_sad}}']};
const KIDS=[{id:'a',name:'하늘',img:'haneul',x:172},{id:'b',name:'바다',img:'bada',x:398},{id:'c',name:'별',img:'byeol',x:882},{id:'d',name:'솔',img:'sol',x:1108}];
const $=s=>document.querySelector(s);
const wait=ms=>new Promise(r=>setTimeout(r,ms));
const stage=$('#stage'),gtxt=$('#gtxt'),nextBtn=$('#next'),screenEl=$('#screen');
let scene=0, step=0, busy=false, done=new Set();

function fit(){const s=Math.min(innerWidth/1292,innerHeight/812);screenEl.style.setProperty('--s',s)}
addEventListener('resize',fit);fit();

function say(t){gtxt.textContent=t;gtxt.style.animation='none';void gtxt.offsetWidth;gtxt.style.animation=''}
const icon=(r,w)=>`<img src="${IC[r]}" alt="" ${w?`width="${w}"`:''}>`;
const bd=r=>`<span class="bd ${r}" data-r="${r}">${icon(r)}${ROLE[r]}</span>`;

function pizzaSVG(){
  let d='',g='';const R=127;
  for(let i=0;i<8;i++){
    const a1=(i*45-90)*Math.PI/180,a2=((i+1)*45-90)*Math.PI/180;
    d+=`<clipPath id="cp${i}"><path d="M130 130 L${(130+R*Math.cos(a1)).toFixed(1)} ${(130+R*Math.sin(a1)).toFixed(1)} A${R} ${R} 0 0 1 ${(130+R*Math.cos(a2)).toFixed(1)} ${(130+R*Math.sin(a2)).toFixed(1)}Z"/></clipPath>`;
    g+=`<g class="slice" data-i="${i}"><image href="${PIZZA}" x="4" y="4" width="252" height="252" clip-path="url(#cp${i})"/></g>`;
  }
  return `<svg viewBox="0 0 260 260" id="pizza" aria-label="피자 8조각"><defs>${d}</defs>${g}</svg>`;
}
function room(tag,title){
  return `<div class="wallart"></div><div class="bunting"></div><div class="title"><span class="tag">${tag}</span><h2>${title}</h2></div>
  ${KIDS.map(k=>`<div class="kid" id="k-${k.id}" style="left:${k.x}px">
     <div class="say" id="s-${k.id}"></div>
     <div class="body" id="bo-${k.id}"><img id="f-${k.id}" src="${FACE[k.img][0]}" alt="${k.name}"></div>
   </div>`).join('')}
  <div class="table"></div>
  ${KIDS.map(k=>`<div class="info" style="left:${k.x}px"><div class="plate" id="m-${k.id}"></div>
       <div class="tagline"><span class="name">${k.name}</span><span class="cnt"><b id="c-${k.id}">0</b>조각</span></div>
       <div class="badges" id="b-${k.id}"></div></div>`).join('')}
  <div class="pz"><div class="stand">${pizzaSVG()}</div><span class="left" id="left">남은 피자 8조각</span></div>
  <div class="stamp" id="stamp"></div>`;
}
function badge(kid,r){$('#b-'+kid).insertAdjacentHTML('beforeend',bd(r))}
function glow(r){document.querySelectorAll('.kid .bd').forEach(b=>b.classList.toggle('glow',b.dataset.r===r))}
function face(kid,m){const k=KIDS.find(x=>x.id===kid);$('#f-'+kid).src=FACE[k.img][m==='happy'?1:m==='sad'?2:0];const b=$('#bo-'+kid);b.classList.remove('bump');void b.offsetWidth;b.classList.add('bump')}
function talk(kid,t){
  document.querySelectorAll('.say').forEach(s=>s.classList.remove('on'));
  if(!kid)return;const s=$('#s-'+kid);s.textContent=t;s.classList.add('on');
}
function stamp(t,cls){const s=$('#stamp');s.textContent=t;s.className='stamp '+cls;requestAnimationFrame(()=>requestAnimationFrame(()=>s.classList.add('show')))}
let counts={};
function resetPizza(){
  counts={a:0,b:0,c:0,d:0};
  document.querySelectorAll('#pizza .slice').forEach(s=>s.classList.remove('gone'));
  KIDS.forEach(k=>{$('#m-'+k.id).innerHTML='';$('#c-'+k.id).textContent='0'});
  $('#left').textContent='남은 피자 8조각';const st=$('#stamp');if(st)st.className='stamp';
}
async function deal(plan){
  const order=[];const p={...plan};
  while(Object.values(p).some(v=>v>0)){for(const k of 'abcd'){if(p[k]>0){order.push(k);p[k]--}}}
  let i=0;
  for(const k of order){
    const kid=KIDS.find(x=>x.id===k);
    $(`#pizza .slice[data-i="${i}"]`).classList.add('gone');i++;
    const f=document.createElement('img');f.src=SLICE;f.className='fly';f.style.left='618px';f.style.top='272px';stage.appendChild(f);
    requestAnimationFrame(()=>{f.style.transform=`translate(${kid.x-640}px,${398-272}px) rotate(${k<'c'?-20:20}deg)`});
    await wait(380);f.remove();
    counts[k]++;$('#m-'+k).insertAdjacentHTML('beforeend',`<img src="${SLICE}" alt="">`);$('#c-'+k).textContent=counts[k];
    $('#left').textContent=`남은 피자 ${8-i}조각`;
    await wait(60);
  }
}

const SCENES=[
  {name:'시작',
   render(){stage.innerHTML=`<div class="wallart"></div><div class="bunting"></div><div class="intro">
     <div class="pic"><img src="{{IMG:intro_table}}" alt="친구 넷이 피자를 앞에 두고 고민하는 모습"></div>
     <div class="txt"><span class="kicker">초등 사회 · 삼권분립</span><h2>피자 한 판,<br>어떻게 나누면<br><em>공평할까?</em></h2><p>피자를 나누면서 나라의 일을 나누는 방법을 알아봐요.</p><div class="legend">${bd('r1')}${bd('r2')}${bd('r3')}</div></div></div>`},
   steps:[()=>say('안녕하세요! 오늘은 피자를 나누면서 공부해요. [다음]을 눌러 시작해요.')]},
  {name:'혼자 하면?',
   render(){stage.innerHTML=room('이야기 1','혼자 다 하면?');resetPizza()},
   steps:[
    ()=>say('친구 넷이 피자 한 판을 먹으려고 해요. 피자는 모두 8조각이에요.'),
    async()=>{say('하늘이가 "내가 다 할게!" 했어요. 정하기, 나누기, 확인하기를 모두 하늘이가 해요.');for(const r of['r1','r2','r3']){badge('a',r);await wait(320)}},
    ()=>{glow('r1');talk('a','규칙은 내가 정할게. 나는 5조각, 너희는 1조각씩!');say('하늘이가 나누는 규칙을 정했어요.')},
    async()=>{glow('r2');talk('a','내가 나눠 줄게!');say('하늘이가 피자를 나눠요.');await deal({a:5,b:1,c:1,d:1});face('a','happy');['b','c','d'].forEach(k=>face(k,'sad'))},
    ()=>{glow(null);talk('b','이건 불공평해!');say('바다가 불공평하다고 말했어요. 누가 확인해 줄까요?')},
    ()=>{glow('r3');talk('a','내가 확인했는데? 아무 문제 없어!');say('확인하는 사람도 하늘이라서 잘못을 고칠 수가 없어요.');stamp('불공평!','bad')},
    ()=>{glow(null);talk(null);say('한 사람이 정하고, 나누고, 확인까지 다 하면 자기에게만 좋게 할 수 있어요.')}
   ]},
  {name:'나눠 맡으면?',
   render(){stage.innerHTML=room('이야기 2','셋이 나눠 맡으면?');resetPizza()},
   steps:[
    ()=>say('이번에는 할 일을 셋으로 나눠요. 다시 피자 8조각으로 시작해요.'),
    async()=>{say('바다는 정하고, 별이는 나누고, 솔이는 확인해요. 한 사람이 한 가지씩만 맡아요.');badge('b','r1');await wait(320);badge('c','r2');await wait(320);badge('d','r3')},
    ()=>{glow('r1');talk('b','모두 똑같이 2조각씩!');say('바다가 규칙을 정했어요. 한 사람에 2조각씩이에요.')},
    async()=>{glow('r2');talk('c','헤헤, 나는 조금 더 가져야지.');say('어? 나누는 별이가 몰래 더 가져가요!');await deal({a:2,b:1,c:4,d:1});face('c','happy');face('b','sad');face('d','sad')},
    ()=>{glow('r3');talk('d','잠깐! 정한 규칙이랑 달라요. 다시 나눠 주세요.');say('확인하는 솔이가 잘못을 찾아냈어요.')},
    async()=>{glow('r2');talk('c','알았어, 규칙대로 다시 나눌게.');say('별이가 규칙대로 다시 나눠요.');resetPizza();KIDS.forEach(k=>face(k.id,'basic'));await wait(300);await deal({a:2,b:2,c:2,d:2});KIDS.forEach(k=>face(k.id,'happy'));stamp('공평!','good')},
    ()=>{glow(null);talk(null);say('일을 나눠 맡고 서로 지켜보니까 모두 공평하게 먹었어요. 나라도 이렇게 일을 셋으로 나눠요.')}
   ]},
  {name:'진짜 나라',
   render(){
    const PL=['{{IMG:place_gukhoe}}','{{IMG:place_jeongbu}}','{{IMG:place_beobwon}}'];
    const C=[['c1','r1','정해요','국회','법을 만들어요','국회의원이 모여서 나라의 규칙을 정해요.'],
             ['c2','r2','나눠요','정부','법대로 나라 일을 해요','대통령과 장관이 학교를 짓고 길을 만들어요.'],
             ['c3','r3','확인해요','법원','법을 지켰는지 판단해요','판사가 재판을 해서 잘잘못을 가려요.']];
    stage.innerHTML=`<div class="wallart"></div><div class="bunting"></div><div class="title"><span class="tag">알아보기</span><h2>진짜 나라에서는 누가 할까?</h2></div>
     <div class="cards">${C.map((c,i)=>`<button type="button" class="card3 ${c[0]}" data-i="${i}" aria-label="${c[2]} 카드 뒤집기"><div class="inner">
      <div class="side front"><span class="ic">${icon(c[1])}</span><strong>${c[2]}</strong><small>눌러서 뒤집기</small></div>
      <div class="side back"><div class="pl"><img src="${PL[i]}" alt="${c[3]}"></div><div class="bt"><span class="from">피자 나누기의 '${c[2]}'</span><strong>${c[3]}</strong><p>${c[4]}</p><span class="ex">${c[5]}</span></div></div>
     </div></button>`).join('')}</div>
     <div class="watch" id="watch"><b>국회 · 정부 · 법원은 서로 지켜보며 한 곳만 힘이 세지지 않게 해요</b></div>`;
    const opened=new Set();
    stage.querySelectorAll('.card3').forEach(b=>b.addEventListener('click',()=>{
      b.classList.toggle('open');opened.add(b.dataset.i);
      const t=['정하는 일은 국회가 해요. 국회는 법을 만들어요.','나누는 일은 정부가 해요. 정부는 법대로 나라 일을 해요.','확인하는 일은 법원이 해요. 법원은 법을 지켰는지 판단해요.'][b.dataset.i];
      say(opened.size===3?t+' 다 봤으면 [다음]을 눌러요.':t);
      if(opened.size===3){$('#watch').classList.add('on');nextBtn.disabled=false}
    }));
   },
   steps:[()=>{say('피자 나누기에서 맡았던 일을 진짜 나라에서는 누가 할까요? 카드 세 장을 눌러 보세요.');return 'lock'}]},
  {name:'퀴즈',render(){quizStart()},steps:[()=>'lock']}
];

const Q=[
  {q:'새로운 법을 만들어요.',a:0,why:'법을 만드는 곳은 국회예요.'},
  {q:'법에 따라 학교를 짓고 길을 만들어요.',a:1,why:'법대로 나라 일을 하는 곳은 정부예요.'},
  {q:'법을 어겼는지 재판해요.',a:2,why:'재판을 하는 곳은 법원이에요.'},
  {q:'피자 나누기에서 "확인하는 친구"는 어디와 닮았을까요?',a:2,why:'규칙대로 했는지 확인하는 건 법원과 닮았어요.'},
  {q:'한 사람이 법도 만들고, 나라 일도 하고, 재판까지 하면?',plain:['모두 공평해져요','불공평해질 수 있어요'],a:1,why:'하늘이처럼 자기에게만 좋게 할 수 있어서 일을 나눠 맡아요.'}
];
let qi=0,score=0,tries=0;
function quizStart(){qi=0;score=0;showQ()}
function showQ(){
  tries=0;const q=Q[qi];
  const dots=Q.map((_,i)=>`<i class="${i<qi?'ok':i===qi?'cur':''}"></i>`).join('');
  const opts=q.plain? q.plain.map((t,i)=>`<button type="button" class="opt plain" data-i="${i}">${t}</button>`).join('')
    : [['c1','r1','국회'],['c2','r2','정부'],['c3','r3','법원']].map((o,i)=>`<button type="button" class="opt ${o[0]}" data-i="${i}">${icon(o[1])}${o[2]}</button>`).join('');
  stage.innerHTML=`<div class="wallart"></div><div class="bunting"></div><div class="title"><span class="tag">퀴즈</span><h2>누가 하는 일일까?</h2></div>
   <div class="quiz"><div class="board"><div class="dots">${dots}</div><span class="qn">${qi+1}번 문제</span><p>${q.q}</p></div><div class="opts">${opts}</div></div>`;
  say('알맞은 답을 눌러 보세요.');nextBtn.disabled=true;
  stage.querySelectorAll('.opt').forEach(b=>b.addEventListener('click',()=>{
    if(+b.dataset.i===q.a){
      if(tries===0)score++;
      b.classList.add('right');stage.querySelectorAll('.opt').forEach(x=>x.disabled=true);
      say('맞았어요! '+q.why);nextBtn.disabled=false;
    }else{tries++;b.classList.remove('wrong');void b.offsetWidth;b.classList.add('wrong');say('다시 생각해 봐요. 피자 나누기를 떠올려 보세요.')}
  }));
}
function finish(){
  stage.innerHTML=`<div class="wallart"></div><div class="bunting"></div><div class="finish">
   <div class="pic"><img class="cheer" src="{{IMG:finish_cheer}}" alt="피자를 똑같이 나눠 들고 웃는 친구들"><img class="badge" src="{{IMG:badge_complete}}" alt="완료 메달"></div>
   <div class="txt"><h3>삼권분립<br>이해 완료!</h3><div class="score"><span>한 번에 맞힌 문제</span><span><b>${score}</b> / ${Q.length}</span></div>
    <div class="sum"><span>${icon('r1')}국회는 법을 만들어요</span><span>${icon('r2')}정부는 법대로 일해요</span><span>${icon('r3')}법원은 법을 지켰는지 판단해요</span></div>
    <button type="button" class="again" id="again">처음부터 다시</button></div></div>`;
  say('잘했어요! 나라의 일을 나눠 맡고 서로 지켜보는 것, 이것이 삼권분립이에요.');
  done.add(4);drawSteps();nextBtn.disabled=true;
  $('#again').addEventListener('click',()=>{done.clear();go(0)});
}

function drawSteps(){
  $('#steps').innerHTML=SCENES.map((s,i)=>`${i?'<span class="link"></span>':''}<button type="button" class="node ${i===scene?'on':''} ${done.has(i)?'done':''}" data-i="${i}"><b>${done.has(i)&&i!==scene?'✓':i+1}</b>${s.name}</button>`).join('');
  $('#steps').querySelectorAll('.node').forEach(b=>b.addEventListener('click',()=>{if(!busy)go(+b.dataset.i)}));
}
async function run(){
  busy=true;nextBtn.disabled=true;
  const r=await SCENES[scene].steps[step]();
  busy=false;if(r!=='lock')nextBtn.disabled=false;
}
function go(i){scene=i;step=0;SCENES[i].render();drawSteps();run()}
nextBtn.addEventListener('click',()=>{
  if(busy)return;
  if(scene===4){if(qi<Q.length-1){qi++;showQ()}else finish();return}
  if(step<SCENES[scene].steps.length-1){step++;run()}
  else{done.add(scene);go(scene+1)}
});
go(0);
</script>
</body>
</html>
