<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="icon" type="image/png" href="favicon.png?v=yr1"><title>피자로 배우는 삼권분립</title>
<style>
/*FONTS*/
/* 레이아웃: 1280×800 고정 화면(가로 태블릿). 콘셉트는 동네 피자집.
   위: 빨강·흰 줄무늬 차양 + 나무 간판 / 가운데: 벽돌 벽 + 칠판 메뉴판 + 체크무늬 식탁보 / 아래: 주문서 같은 안내 줄 */
:root{
  --wall:#F7E9D7; --wall2:#EFD9BF; --brick:#E8CDAE;
  --wood:#8A5532; --wood2:#6B3F22; --wood3:#4A2A16;
  --board:#2E3A33; --board2:#3A4A40; --chalk:#F4F1E8;
  --red:#D7372A; --red2:#B32418; --redl:#FCE3DF;
  --basil:#2F8F55; --basil2:#1F6E3F;
  --paper:#FFFDF8; --paper2:#F6EFE3; --ink:#2B1D14; --ink2:#6E5646; --ink3:#A8927F; --line:#E6D6C3;
  --r1:#3B6FF0; --r1l:#E8EFFE; --r1d:#2A55C4;
  --r2:#14A06A; --r2l:#E3F6EE; --r2d:#0C7C51;
  --r3:#7B55E8; --r3l:#F0EBFE; --r3d:#5A36C4;
  --good:#2F8F55; --bad:#D7372A;
  --sh1:0 2px 0 rgba(74,42,22,.12),0 6px 16px rgba(74,42,22,.12);
  --sh2:0 4px 0 rgba(74,42,22,.16),0 14px 32px rgba(74,42,22,.18);
  --f-title:"HakgyoKossuyeom","HakgyoBareun","Malgun Gothic",sans-serif;
  --f-body:"Freesentation","HakgyoBareun","Malgun Gothic","Apple SD Gothic Neo",sans-serif;
  --f-talk:"CuteHand","HakgyoBareun",sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden}
body{word-break:keep-all;background:#3B2618;background-image:radial-gradient(circle at 50% 30%,#5A3A24,#2A190F 75%);font-family:var(--f-body);color:var(--ink);-webkit-tap-highlight-color:transparent;user-select:none}
button{font-family:inherit;color:inherit;cursor:pointer;border:0}
img{-webkit-user-drag:none}

.screen{position:absolute;left:50%;top:50%;width:1280px;height:800px;transform-origin:center;transform:translate(-50%,-50%) scale(var(--s,1));
  background:var(--wall);border-radius:26px;overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.45)}

/* 차양 + 간판 */
.bar{position:absolute;inset:0 0 auto 0;height:96px;z-index:20;padding:0 26px 18px;display:flex;align-items:center;justify-content:space-between;
  background:repeating-linear-gradient(90deg,var(--red) 0 64px,#fff 64px 128px)}
.bar::after{content:"";position:absolute;left:0;right:0;bottom:-16px;height:18px;
  background:radial-gradient(circle at 32px 0,var(--red) 31px,transparent 32px) 0 0/128px 18px,radial-gradient(circle at 96px 0,#fff 31px,transparent 32px) 0 0/128px 18px;filter:drop-shadow(0 4px 2px rgba(74,42,22,.18))}
.brand{display:flex;align-items:center;gap:12px;background:var(--wood);background-image:repeating-linear-gradient(180deg,rgba(255,255,255,.05) 0 3px,transparent 3px 9px);padding:8px 20px 8px 12px;border-radius:14px;box-shadow:0 4px 0 var(--wood3),0 10px 18px rgba(0,0,0,.25);border:3px solid var(--wood2)}
.brand svg{width:40px;height:40px}
.brand h1{margin:0;font-family:var(--f-title);font-weight:400;font-size:28px;color:var(--chalk);letter-spacing:-.3px;text-shadow:0 2px 0 var(--wood3)}
.brand h1 em{font-style:normal;color:#FFB4A6}
.right{display:flex;align-items:center;gap:12px}
.path{display:flex;align-items:center;gap:4px;background:var(--paper);padding:5px;border-radius:14px;box-shadow:var(--sh1)}
.node{display:flex;align-items:center;gap:6px;height:40px;padding:0 13px 0 7px;border-radius:10px;background:transparent;font-size:16px;color:var(--ink2);transition:background .2s,color .2s}
.node b{display:grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--paper2);color:var(--ink2);font-size:13px;font-weight:700}
.node:hover{background:var(--paper2)}
.node.on{background:var(--red);color:#fff}
.node.on b{background:#fff;color:var(--red)}
.node.done b{background:var(--basil);color:#fff}
.link{display:none}
.logo{width:58px;height:58px;object-fit:contain;display:block;background:var(--paper);border-radius:0;padding:3px;box-shadow:var(--sh1)}

/* 벽 */
.scene{position:absolute;left:0;right:0;top:96px;height:548px;overflow:hidden}
.wallart{position:absolute;inset:0;
  background:
   linear-gradient(transparent 0 calc(100% - 120px),rgba(74,42,22,.06) calc(100% - 120px)),
   repeating-linear-gradient(0deg,transparent 0 38px,var(--brick) 38px 40px),
   repeating-linear-gradient(90deg,transparent 0 78px,var(--brick) 78px 80px);
  -webkit-mask:linear-gradient(#000,#000);opacity:1}
.wallart::after{content:"";position:absolute;inset:0;background:radial-gradient(700px 360px at 50% 30%,rgba(255,250,240,.85),rgba(247,233,215,.4) 70%)}
.bunting{display:none}

/* 칠판 메뉴판 제목 */
.title{position:absolute;left:30px;top:22px;display:flex;align-items:center;gap:12px;z-index:6;background:var(--board);background-image:radial-gradient(circle at 30% 30%,var(--board2),var(--board));border:7px solid var(--wood);border-radius:12px;padding:8px 20px;box-shadow:var(--sh1)}
.title .tag{background:var(--red);color:#fff;font-size:14px;border-radius:6px;padding:3px 10px}
.title h2{margin:0;font-family:var(--f-title);font-weight:400;font-size:28px;color:var(--chalk)}
.title.mid{left:640px;top:14px;transform:translateX(-50%);flex-direction:column;gap:4px;text-align:center;padding:8px 26px 10px}
.title.mid::before,.title.mid::after{content:"";position:absolute;top:-26px;width:3px;height:22px;background:var(--wood2)}
.title.mid::before{left:24%}.title.mid::after{right:24%}
.title.mid h2{font-size:26px;white-space:nowrap}

/* 식탁: 체크무늬 식탁보 */
.table{position:absolute;left:20px;right:20px;top:366px;height:200px;z-index:3;border-radius:18px 18px 0 0;
  background:
   linear-gradient(90deg,rgba(215,55,42,.55) 50%,transparent 50%) 0 0/44px 44px,
   linear-gradient(rgba(215,55,42,.55) 50%,transparent 50%) 0 0/44px 44px,#fff;
  box-shadow:0 -4px 0 rgba(179,36,24,.25),0 -10px 24px rgba(74,42,22,.18)}
.table::before{content:"";position:absolute;left:0;right:0;top:0;height:10px;border-radius:18px 18px 0 0;background:rgba(255,255,255,.55)}

.kid{position:absolute;top:0;width:250px;height:548px;z-index:2;transform:translateX(-50%)}
.kid .body{position:absolute;left:50%;top:150px;width:210px;transform:translateX(-50%);transition:transform .25s}
.kid .body img{width:210px;height:auto;display:block}
.kid:hover .body{transform:translateX(-50%) translateY(-6px)}
.kid .body.bump{animation:hop .45s}
@keyframes hop{30%{transform:translateX(-50%) translateY(-16px)}60%{transform:translateX(-50%) translateY(0)}80%{transform:translateX(-50%) translateY(-4px)}}
.info{position:absolute;width:290px;transform:translateX(-50%);top:380px;z-index:5;display:flex;flex-direction:column;align-items:center;gap:7px}
.plate{width:214px;height:60px;border-radius:50%;background:radial-gradient(ellipse at 50% 45%,#fff 0 58%,#F2EDE6 60% 100%);box-shadow:0 4px 0 rgba(74,42,22,.18),0 8px 14px rgba(74,42,22,.15);display:flex;align-items:center;justify-content:center;padding:0 18px}
.plate img{width:30px;height:32px;object-fit:contain;margin:0 -4px;animation:drop .35s both}
@keyframes drop{from{transform:translateY(-30px) scale(.4);opacity:0}}
.tagline{display:flex;align-items:center;gap:6px;background:var(--paper);border-radius:999px;padding:3px 4px 3px 14px;box-shadow:var(--sh1)}
.name{font-size:22px;color:var(--ink)}
.cnt{background:var(--red);color:#fff;border-radius:999px;padding:2px 11px;font-size:15px;font-variant-numeric:tabular-nums;min-width:62px;text-align:center}
.cnt b{font-size:18px;font-weight:400}
.badges{display:flex;gap:4px;min-height:32px;flex-wrap:nowrap;justify-content:center}
.bd{display:inline-flex;align-items:center;gap:3px;height:30px;padding:0 10px 0 4px;border-radius:999px;font-weight:700;font-size:14px;white-space:nowrap;background:#fff;box-shadow:var(--sh1);animation:pop .4s both;transition:transform .2s,background .2s,color .2s}
.bd img{width:22px;height:22px;object-fit:contain}
.intro .bd{height:40px;font-size:16px;padding:0 15px 0 7px}.intro .bd img{width:28px;height:28px}
.bd.r1{color:var(--r1d)}.bd.r2{color:var(--r2d)}.bd.r3{color:var(--r3d)}
.bd.glow{transform:scale(1.12)}
.bd.r1.glow{background:var(--r1);color:#fff}.bd.r2.glow{background:var(--r2);color:#fff}.bd.r3.glow{background:var(--r3);color:#fff}
@keyframes pop{from{transform:scale(.4);opacity:0}70%{transform:scale(1.06)}to{transform:none;opacity:1}}

.say{position:absolute;left:50%;top:44px;margin-left:-130px;width:260px;transform-origin:50% 100%;background:var(--paper);border-radius:22px;padding:10px 16px;text-align:center;z-index:8;display:none;box-shadow:var(--sh2);color:var(--ink)}
.say::after{content:"";position:absolute;left:50%;bottom:-8px;width:18px;height:18px;margin-left:-9px;background:var(--paper);transform:rotate(45deg);border-radius:3px}
.say.on{display:block;animation:sayPop .35s both}
@keyframes sayPop{from{transform:scale(.5) translateY(16px);opacity:0}70%{transform:scale(1.04)}to{transform:none;opacity:1}}

/* 피자: 나무 도마 위 */
.pz{position:absolute;left:640px;top:116px;width:300px;transform:translateX(-50%);z-index:4;text-align:center}
.stand{width:300px;height:300px;border-radius:50%;background:radial-gradient(circle,#B27646 0 60%,var(--wood) 61% 100%);box-shadow:0 6px 0 var(--wood3),0 16px 26px rgba(74,42,22,.3);display:grid;place-items:center;position:relative}
.stand::before{content:"";position:absolute;right:-30px;top:50%;width:46px;height:30px;margin-top:-15px;border-radius:0 15px 15px 0;background:var(--wood);box-shadow:0 4px 0 var(--wood3);z-index:-1}
.pz svg{width:266px;height:266px;display:block}
.slice{transition:transform .35s,opacity .35s;transform-origin:130px 130px}
.slice.gone{opacity:0;transform:scale(.5)}
.left{display:inline-block;margin-top:12px;background:var(--board);color:var(--chalk);border-radius:8px;padding:4px 14px;font-size:16px;position:relative;z-index:5;box-shadow:var(--sh1);font-family:var(--f-title)}
.fly{position:absolute;width:44px;height:46px;z-index:30;pointer-events:none;transition:transform .45s cubic-bezier(.3,1.3,.5,1),opacity .2s}

.stamp{position:absolute;left:640px;top:266px;transform:translate(-50%,-50%) rotate(-12deg) scale(1.8);opacity:0;z-index:12;font-family:var(--f-title);font-size:52px;padding:6px 26px;border:6px solid currentColor;border-radius:16px;background:rgba(255,253,248,.92);transition:transform .35s cubic-bezier(.3,1.6,.5,1),opacity .2s;pointer-events:none;white-space:nowrap}
.stamp.show{opacity:1;transform:translate(-50%,-50%) rotate(-12deg) scale(1)}
.stamp.bad{color:var(--bad)}.stamp.good{color:var(--good)}

/* 시작 */
.intro{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;gap:44px;padding:10px 56px 0}
.intro .pic{width:600px;background:var(--paper);padding:14px 14px 40px;box-shadow:var(--sh2);transform:rotate(-2deg);transition:transform .3s;position:relative}
.intro .pic::after{content:"우리 동네 피자집";position:absolute;left:0;right:0;bottom:4px;text-align:center;font-family:var(--f-talk);font-size:30px;color:var(--ink2)}
.intro .pic::before{content:"";position:absolute;left:50%;top:-14px;width:110px;height:28px;margin-left:-55px;background:rgba(215,55,42,.35);transform:rotate(3deg)}
.intro .pic:hover{transform:rotate(0)}
.intro .pic img{width:100%;display:block;background:var(--paper2)}
.intro .txt{width:480px;display:flex;flex-direction:column;gap:18px;background:var(--board);background-image:radial-gradient(circle at 30% 30%,var(--board2),var(--board));border:10px solid var(--wood);border-radius:14px;padding:26px 30px;box-shadow:var(--sh2);color:var(--chalk)}
.intro .kicker{align-self:flex-start;background:var(--red);color:#fff;border-radius:6px;padding:4px 12px;font-size:15px}
.intro h2{margin:0;font-family:var(--f-title);font-weight:400;font-size:50px;line-height:1.18;color:var(--chalk)}
.intro h2 em{font-style:normal;color:#FFB4A6}
.intro p{margin:0;font-size:19px;color:rgba(244,241,232,.85);line-height:1.5}
.legend{display:flex;gap:8px}

/* 카드: 피자 상자 */
.cards{position:absolute;left:56px;right:56px;top:96px;display:grid;grid-template-columns:repeat(3,1fr);gap:28px}
.card3{background:none;padding:0;perspective:1200px;height:390px;text-align:left}
.card3 .inner{position:relative;height:100%;transition:transform .6s cubic-bezier(.3,1.2,.5,1);transform-style:preserve-3d}
.card3.open .inner{transform:rotateY(180deg)}
.card3:hover:not(.open) .inner{transform:translateY(-6px) rotate(-1deg)}
.card3 .side{position:absolute;inset:0;border-radius:10px;backface-visibility:hidden;box-shadow:var(--sh2);overflow:hidden}
.card3 .front{background:#D9A86C;background-image:linear-gradient(135deg,rgba(255,255,255,.12) 25%,transparent 25% 50%,rgba(255,255,255,.12) 50% 75%,transparent 75%);background-size:14px 14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;border:3px solid #C08F55}
.card3 .front::before{content:"PIZZA";position:absolute;top:16px;left:0;right:0;text-align:center;font-family:var(--f-title);font-size:18px;letter-spacing:6px;color:rgba(107,63,34,.55)}
.card3 .front .ic{width:150px;height:150px;border-radius:50%;background:#fff;display:grid;place-items:center;box-shadow:0 0 0 8px var(--c),var(--sh1)}
.card3 .front .ic img{width:92px;height:92px;object-fit:contain}
.card3 .front strong{font-family:var(--f-title);font-weight:400;font-size:40px;color:#fff;background:var(--c);padding:2px 18px;border-radius:10px}
.card3 .front small{font-size:15px;font-weight:700;color:var(--wood3)}
.card3 .back{transform:rotateY(180deg);background:var(--paper);display:flex;flex-direction:column}
.card3 .back .pl{height:196px;background:var(--cl);display:grid;place-items:center;border-bottom:4px dashed var(--c)}
.card3 .back .pl img{max-height:180px;max-width:92%;object-fit:contain}
.card3 .back .bt{padding:16px 22px;display:flex;flex-direction:column;gap:5px}
.card3 .back .from{font-size:14px;font-weight:700;color:var(--c)}
.card3 .back strong{font-family:var(--f-title);font-weight:400;font-size:40px;line-height:1.05;color:var(--ink)}
.card3 .back p{margin:0;font-size:20px;font-weight:700;color:var(--cd)}
.card3 .back span.ex{font-size:16px;color:var(--ink2);line-height:1.45}
.c1{--c:var(--r1);--cl:var(--r1l);--cd:var(--r1d)}.c2{--c:var(--r2);--cl:var(--r2l);--cd:var(--r2d)}.c3{--c:var(--r3);--cl:var(--r3l);--cd:var(--r3d)}
.watch{position:absolute;left:0;right:0;top:500px;text-align:center;opacity:0;transform:translateY(8px);transition:.4s}
.watch.on{opacity:1;transform:none}
.watch b{display:inline-block;background:var(--board);color:var(--chalk);border-radius:10px;padding:8px 20px;font-size:18px;font-weight:400;border:4px solid var(--wood)}

/* 퀴즈: 주문서 */
.quiz{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;padding-top:94px;gap:26px}
.board{width:860px;background:var(--paper);padding:26px 36px 28px;text-align:center;box-shadow:var(--sh2);position:relative;
  -webkit-mask:radial-gradient(circle 9px at 50% 100%,transparent 98%,#000) 0 0/26px 100% repeat-x;mask:radial-gradient(circle 9px at 13px 100%,transparent 98%,#000) 0 0/26px 100% repeat-x}
.board::before{content:"주문서";position:absolute;left:26px;top:20px;font-family:var(--f-title);font-size:15px;color:#fff;background:var(--red);padding:2px 10px;border-radius:6px}
.board .qn{font-size:15px;font-weight:700;color:var(--red)}
.board p{margin:8px 0 0;font-family:var(--f-title);font-size:36px;color:var(--ink);text-wrap:balance}
.dots{position:absolute;right:26px;top:22px;display:flex;gap:6px}
.dots i{width:10px;height:10px;border-radius:50%;background:var(--line)}
.dots i.ok{background:var(--good)}.dots i.cur{background:var(--red);width:24px;border-radius:999px}
.opts{display:flex;gap:24px}
.opt{width:236px;height:196px;border-radius:50%;background:radial-gradient(circle,#fff 0 60%,#F2EDE6 62% 100%);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;font-size:30px;color:var(--cd,var(--ink));box-shadow:0 6px 0 rgba(74,42,22,.2),0 14px 24px rgba(74,42,22,.18);transition:transform .15s}
.opt img{width:80px;height:80px;object-fit:contain}
.opt:hover{transform:translateY(-5px) rotate(-3deg)}
.opt:active{transform:translateY(2px)}
.opt.plain{width:380px;height:140px;border-radius:70px;font-size:26px}
.opt.right{background:radial-gradient(circle,#E3F6EA 0 60%,#C7EBD5 62% 100%);color:var(--good)}
.opt.wrong{animation:shake .4s}
.opt[disabled]{cursor:default}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}

/* 완료: 영수증 */
.finish{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;gap:50px;padding:10px 60px 0 80px}
.finish .pic{position:relative;width:560px;background:var(--paper);padding:20px 18px 12px;box-shadow:var(--sh2);transform:rotate(-1.5deg)}
.finish .pic img.cheer{width:100%;display:block}
.finish .pic img.badge{position:absolute;left:-34px;top:-40px;width:130px;animation:pop .6s .2s both}
.finish .txt{width:430px;display:flex;flex-direction:column;gap:14px;background:var(--paper);padding:26px 28px 34px;box-shadow:var(--sh2);
  mask:radial-gradient(circle 9px at 13px 100%,transparent 98%,#000) 0 0/26px 100% repeat-x;-webkit-mask:radial-gradient(circle 9px at 13px 100%,transparent 98%,#000) 0 0/26px 100% repeat-x}
.finish h3{margin:0;font-family:var(--f-title);font-weight:400;font-size:42px;line-height:1.15;color:var(--red)}
.finish .score{border-top:2px dashed var(--line);border-bottom:2px dashed var(--line);padding:10px 0;font-size:19px;font-weight:700;color:var(--ink2)}
.finish .score b{color:var(--red);font-size:30px;font-family:var(--f-title);font-weight:400}
.sum{display:flex;flex-direction:column;gap:10px}
.sum span{display:flex;align-items:center;gap:12px;font-size:18px;font-weight:700}
.sum img{width:36px;height:36px;object-fit:contain;background:var(--paper2);border-radius:50%;padding:4px}
.again{align-self:flex-start;background:var(--red);border-radius:12px;padding:11px 22px;font-size:17px;color:#fff;font-family:var(--f-title);box-shadow:0 4px 0 var(--red2)}
.again:hover{transform:translateY(-2px)}

/* 하단 안내 */
.dock{position:absolute;left:0;right:0;bottom:0;height:156px;background:var(--wood);background-image:repeating-linear-gradient(180deg,rgba(255,255,255,.05) 0 3px,transparent 3px 10px);border-top:6px solid var(--wood2);z-index:15}
.bubble{position:absolute;left:22px;right:238px;top:20px;bottom:24px;background:var(--paper);border-radius:18px;padding:0 26px;display:flex;flex-direction:column;justify-content:center;gap:2px;z-index:16;box-shadow:0 4px 0 var(--wood3)}
.bubble::before{display:none}
.bubble .who{font-size:13px;font-weight:700;color:var(--red)}
.bubble .txt{font-family:var(--f-talk);font-size:38px;line-height:1.3;color:var(--ink);animation:type .35s both}
@keyframes type{from{opacity:0;transform:translateY(5px)}}
.next{position:absolute;right:22px;top:20px;bottom:24px;width:200px;border-radius:18px;background:var(--red);color:#fff;font-size:28px;font-family:var(--f-title);display:flex;align-items:center;justify-content:center;gap:6px;box-shadow:0 6px 0 var(--red2),0 10px 18px rgba(0,0,0,.25);transition:transform .12s,box-shadow .12s;z-index:16}
.next:hover{transform:translateY(-2px)}
.next:active{transform:translateY(4px);box-shadow:0 2px 0 var(--red2)}
.next[disabled]{background:#A98B74;box-shadow:0 6px 0 #7D624F;color:rgba(255,255,255,.75);cursor:default;transform:none}
.credit{position:absolute;right:26px;bottom:4px;font-size:10px;color:rgba(255,255,255,.55);z-index:16}
.say{font-family:var(--f-talk);font-size:30px;line-height:1.2}
.name,.cnt,.node,.opt,.board p,.watch b,.intro .kicker,.title .tag{font-family:var(--f-title);font-weight:400}
:focus-visible{outline:3px solid var(--red);outline-offset:3px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="screen" id="screen">
  <header class="bar">
    <div class="brand">
      <img src="{{IMG:pizza_slice}}" alt="" style="width:40px;height:42px;object-fit:contain">
      <h1>피자로 배우는 <em>삼권분립</em></h1>
    </div>
    <div class="right"><nav class="path" id="steps" aria-label="단계"></nav><img class="logo" src="{{IMG:logo_head}}" alt="예람쌤"></div>
  </header>

  <main class="scene" id="stage"></main>

  <footer class="dock">
    <div class="bubble" aria-live="polite"><span class="who">예람쌤</span><span class="txt" id="gtxt"></span></div>
    <button class="next" id="next" type="button">다음 <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg></button>
  </footer>
  <span class="credit">만든 사람 김예람 (부천북초등학교)</span>
</div>

<script>
const IC={r1:'{{IMG:icon_role_decide}}',r2:'{{IMG:icon_role_share}}',r3:'{{IMG:icon_role_check}}'};
const ROLE={r1:'정해요',r2:'나눠요',r3:'확인해요'};
const PIZZA='{{IMG:pizza_whole}}', SLICE='{{IMG:pizza_slice}}';
const FACE={haneul:['{{IMG:kid_haneul_basic}}','{{IMG:kid_haneul_happy}}','{{IMG:kid_haneul_sad}}'],bada:['{{IMG:kid_bada_basic}}','{{IMG:kid_bada_happy}}','{{IMG:kid_bada_sad}}'],byeol:['{{IMG:kid_byeol_basic}}','{{IMG:kid_byeol_happy}}','{{IMG:kid_byeol_sad}}'],sol:['{{IMG:kid_sol_basic}}','{{IMG:kid_sol_happy}}','{{IMG:kid_sol_sad}}']};
const KIDS=[{id:'a',name:'하늘',img:'haneul',x:172},{id:'b',name:'바다',img:'bada',x:398},{id:'c',name:'별',img:'byeol',x:882},{id:'d',name:'솔',img:'sol',x:1108}];
const $=s=>document.querySelector(s);
const wait=ms=>new Promise(r=>setTimeout(r,ms));
const stage=$('#stage'),gtxt=$('#gtxt'),nextBtn=$('#next'),screenEl=$('#screen');
let scene=0, step=0, busy=false, done=new Set();

function fit(){const s=Math.min(innerWidth/1292,innerHeight/812);screenEl.style.setProperty('--s',s)}
addEventListener('resize',fit);fit();

function say(t){gtxt.textContent=t;gtxt.style.animation='none';void gtxt.offsetWidth;gtxt.style.animation=''}
const icon=(r,w)=>`<img src="${IC[r]}" alt="" ${w?`width="${w}"`:''}>`;
const bd=r=>`<span class="bd ${r}" data-r="${r}">${icon(r)}${ROLE[r]}</span>`;

function pizzaSVG(){
  let d='',g='';const R=127;
  for(let i=0;i<8;i++){
    const a1=(i*45-90)*Math.PI/180,a2=((i+1)*45-90)*Math.PI/180;
    d+=`<clipPath id="cp${i}"><path d="M130 130 L${(130+R*Math.cos(a1)).toFixed(1)} ${(130+R*Math.sin(a1)).toFixed(1)} A${R} ${R} 0 0 1 ${(130+R*Math.cos(a2)).toFixed(1)} ${(130+R*Math.sin(a2)).toFixed(1)}Z"/></clipPath>`;
    g+=`<g class="slice" data-i="${i}"><image href="${PIZZA}" x="4" y="4" width="252" height="252" clip-path="url(#cp${i})"/></g>`;
  }
  return `<svg viewBox="0 0 260 260" id="pizza" aria-label="피자 8조각"><defs>${d}</defs>${g}</svg>`;
}
function room(tag,title){
  return `<div class="wallart"></div><div class="bunting"></div><div class="title mid"><span class="tag">${tag}</span><h2>${title}</h2></div>
  ${KIDS.map(k=>`<div class="kid" id="k-${k.id}" style="left:${k.x}px">
     <div class="say" id="s-${k.id}"></div>
     <div class="body" id="bo-${k.id}"><img id="f-${k.id}" src="${FACE[k.img][0]}" alt="${k.name}"></div>
   </div>`).join('')}
  <div class="table"></div>
  ${KIDS.map(k=>`<div class="info" style="left:${k.x}px"><div class="plate" id="m-${k.id}"></div>
       <div class="tagline"><span class="name">${k.name}</span><span class="cnt"><b id="c-${k.id}">0</b>조각</span></div>
       <div class="badges" id="b-${k.id}"></div></div>`).join('')}
  <div class="pz"><div class="stand">${pizzaSVG()}</div><span class="left" id="left">남은 피자 8조각</span></div>
  <div class="stamp" id="stamp"></div>`;
}
function badge(kid,r){$('#b-'+kid).insertAdjacentHTML('beforeend',bd(r))}
function glow(r){document.querySelectorAll('.kid .bd').forEach(b=>b.classList.toggle('glow',b.dataset.r===r))}
function face(kid,m){const k=KIDS.find(x=>x.id===kid);$('#f-'+kid).src=FACE[k.img][m==='happy'?1:m==='sad'?2:0];const b=$('#bo-'+kid);b.classList.remove('bump');void b.offsetWidth;b.classList.add('bump')}
function talk(kid,t){
  document.querySelectorAll('.say').forEach(s=>s.classList.remove('on'));
  if(!kid)return;const s=$('#s-'+kid);s.textContent=t;s.classList.add('on');
}
function stamp(t,cls){const s=$('#stamp');s.textContent=t;s.className='stamp '+cls;requestAnimationFrame(()=>requestAnimationFrame(()=>s.classList.add('show')))}
let counts={};
function resetPizza(){
  counts={a:0,b:0,c:0,d:0};
  document.querySelectorAll('#pizza .slice').forEach(s=>s.classList.remove('gone'));
  KIDS.forEach(k=>{$('#m-'+k.id).innerHTML='';$('#c-'+k.id).textContent='0'});
  $('#left').textContent='남은 피자 8조각';const st=$('#stamp');if(st)st.className='stamp';
}
async function deal(plan){
  const order=[];const p={...plan};
  while(Object.values(p).some(v=>v>0)){for(const k of 'abcd'){if(p[k]>0){order.push(k);p[k]--}}}
  let i=0;
  for(const k of order){
    const kid=KIDS.find(x=>x.id===k);
    $(`#pizza .slice[data-i="${i}"]`).classList.add('gone');i++;
    const f=document.createElement('img');f.src=SLICE;f.className='fly';f.style.left='618px';f.style.top='272px';stage.appendChild(f);
    requestAnimationFrame(()=>{f.style.transform=`translate(${kid.x-640}px,${398-272}px) rotate(${k<'c'?-20:20}deg)`});
    await wait(380);f.remove();
    counts[k]++;$('#m-'+k).insertAdjacentHTML('beforeend',`<img src="${SLICE}" alt="">`);$('#c-'+k).textContent=counts[k];
    $('#left').textContent=`남은 피자 ${8-i}조각`;
    await wait(60);
  }
}

const SCENES=[
  {name:'시작',
   render(){stage.innerHTML=`<div class="wallart"></div><div class="bunting"></div><div class="intro">
     <div class="pic"><img src="{{IMG:intro_table}}" alt="친구 넷이 피자를 앞에 두고 고민하는 모습"></div>
     <div class="txt"><span class="kicker">초등 사회 · 삼권분립</span><h2>피자 한 판,<br>어떻게 나누면<br><em>공평할까?</em></h2><p>피자를 나누면서 나라의 일을 나누는 방법을 알아봐요.</p><div class="legend">${bd('r1')}${bd('r2')}${bd('r3')}</div></div></div>`},
   steps:[()=>say('안녕하세요! 오늘은 피자를 나누면서 공부해요. [다음]을 눌러 시작해요.')]},
  {name:'혼자 하면?',
   render(){stage.innerHTML=room('이야기 1','혼자 다 하면?');resetPizza()},
   steps:[
    ()=>say('친구 넷이 피자 한 판을 먹으려고 해요. 피자는 모두 8조각이에요.'),
    async()=>{say('하늘이가 "내가 다 할게!" 했어요. 정하기, 나누기, 확인하기를 모두 하늘이가 해요.');for(const r of['r1','r2','r3']){badge('a',r);await wait(320)}},
    ()=>{glow('r1');talk('a','규칙은 내가 정할게. 나는 5조각, 너희는 1조각씩!');say('하늘이가 나누는 규칙을 정했어요.')},
    async()=>{glow('r2');talk('a','내가 나눠 줄게!');say('하늘이가 피자를 나눠요.');await deal({a:5,b:1,c:1,d:1});face('a','happy');['b','c','d'].forEach(k=>face(k,'sad'))},
    ()=>{glow(null);talk('b','이건 불공평해!');say('바다가 불공평하다고 말했어요. 누가 확인해 줄까요?')},
    ()=>{glow('r3');talk('a','내가 확인했는데? 아무 문제 없어!');say('확인하는 사람도 하늘이라서 잘못을 고칠 수가 없어요.');stamp('불공평!','bad')},
    ()=>{glow(null);talk(null);say('한 사람이 정하고, 나누고, 확인까지 다 하면 자기에게만 좋게 할 수 있어요.')}
   ]},
  {name:'나눠 맡으면?',
   render(){stage.innerHTML=room('이야기 2','셋이 나눠 맡으면?');resetPizza()},
   steps:[
    ()=>say('이번에는 할 일을 셋으로 나눠요. 다시 피자 8조각으로 시작해요.'),
    async()=>{say('바다는 정하고, 별이는 나누고, 솔이는 확인해요. 한 사람이 한 가지씩만 맡아요.');badge('b','r1');await wait(320);badge('c','r2');await wait(320);badge('d','r3')},
    ()=>{glow('r1');talk('b','모두 똑같이 2조각씩!');say('바다가 규칙을 정했어요. 한 사람에 2조각씩이에요.')},
    async()=>{glow('r2');talk('c','헤헤, 나는 조금 더 가져야지.');say('어? 나누는 별이가 몰래 더 가져가요!');await deal({a:2,b:1,c:4,d:1});face('c','happy');face('b','sad');face('d','sad')},
    ()=>{glow('r3');talk('d','잠깐! 정한 규칙이랑 달라요. 다시 나눠 주세요.');say('확인하는 솔이가 잘못을 찾아냈어요.')},
    async()=>{glow('r2');talk('c','알았어, 규칙대로 다시 나눌게.');say('별이가 규칙대로 다시 나눠요.');resetPizza();KIDS.forEach(k=>face(k.id,'basic'));await wait(300);await deal({a:2,b:2,c:2,d:2});KIDS.forEach(k=>face(k.id,'happy'));stamp('공평!','good')},
    ()=>{glow(null);talk(null);say('일을 나눠 맡고 서로 지켜보니까 모두 공평하게 먹었어요. 나라도 이렇게 일을 셋으로 나눠요.')}
   ]},
  {name:'진짜 나라',
   render(){
    const PL=['{{IMG:place_gukhoe}}','{{IMG:place_jeongbu}}','{{IMG:place_beobwon}}'];
    const C=[['c1','r1','정해요','국회','법을 만들어요','국회의원이 모여서 나라의 규칙을 정해요.'],
             ['c2','r2','나눠요','정부','법대로 나라 일을 해요','대통령과 장관이 학교를 짓고 길을 만들어요.'],
             ['c3','r3','확인해요','법원','법을 지켰는지 판단해요','판사가 재판을 해서 잘잘못을 가려요.']];
    stage.innerHTML=`<div class="wallart"></div><div class="bunting"></div><div class="title"><span class="tag">알아보기</span><h2>진짜 나라에서는 누가 할까?</h2></div>
     <div class="cards">${C.map((c,i)=>`<button type="button" class="card3 ${c[0]}" data-i="${i}" aria-label="${c[2]} 카드 뒤집기"><div class="inner">
      <div class="side front"><span class="ic">${icon(c[1])}</span><strong>${c[2]}</strong><small>눌러서 뒤집기</small></div>
      <div class="side back"><div class="pl"><img src="${PL[i]}" alt="${c[3]}"></div><div class="bt"><span class="from">피자 나누기의 '${c[2]}'</span><strong>${c[3]}</strong><p>${c[4]}</p><span class="ex">${c[5]}</span></div></div>
     </div></button>`).join('')}</div>
     <div class="watch" id="watch"><b>국회 · 정부 · 법원은 서로 지켜보며 한 곳만 힘이 세지지 않게 해요</b></div>`;
    const opened=new Set();
    stage.querySelectorAll('.card3').forEach(b=>b.addEventListener('click',()=>{
      b.classList.toggle('open');opened.add(b.dataset.i);
      const t=['정하는 일은 국회가 해요. 국회는 법을 만들어요.','나누는 일은 정부가 해요. 정부는 법대로 나라 일을 해요.','확인하는 일은 법원이 해요. 법원은 법을 지켰는지 판단해요.'][b.dataset.i];
      say(opened.size===3?t+' 다 봤으면 [다음]을 눌러요.':t);
      if(opened.size===3){$('#watch').classList.add('on');nextBtn.disabled=false}
    }));
   },
   steps:[()=>{say('피자 나누기에서 맡았던 일을 진짜 나라에서는 누가 할까요? 카드 세 장을 눌러 보세요.');return 'lock'}]},
  {name:'퀴즈',render(){quizStart()},steps:[()=>'lock']}
];

const Q=[
  {q:'새로운 법을 만들어요.',a:0,why:'법을 만드는 곳은 국회예요.'},
  {q:'법에 따라 학교를 짓고 길을 만들어요.',a:1,why:'법대로 나라 일을 하는 곳은 정부예요.'},
  {q:'법을 어겼는지 재판해요.',a:2,why:'재판을 하는 곳은 법원이에요.'},
  {q:'피자 나누기에서 "확인하는 친구"는 어디와 닮았을까요?',a:2,why:'규칙대로 했는지 확인하는 건 법원과 닮았어요.'},
  {q:'한 사람이 법도 만들고, 나라 일도 하고, 재판까지 하면?',plain:['모두 공평해져요','불공평해질 수 있어요'],a:1,why:'하늘이처럼 자기에게만 좋게 할 수 있어서 일을 나눠 맡아요.'}
];
let qi=0,score=0,tries=0;
function quizStart(){qi=0;score=0;showQ()}
function showQ(){
  tries=0;const q=Q[qi];
  const dots=Q.map((_,i)=>`<i class="${i<qi?'ok':i===qi?'cur':''}"></i>`).join('');
  const opts=q.plain? q.plain.map((t,i)=>`<button type="button" class="opt plain" data-i="${i}">${t}</button>`).join('')
    : [['c1','r1','국회'],['c2','r2','정부'],['c3','r3','법원']].map((o,i)=>`<button type="button" class="opt ${o[0]}" data-i="${i}">${icon(o[1])}${o[2]}</button>`).join('');
  stage.innerHTML=`<div class="wallart"></div><div class="bunting"></div><div class="title"><span class="tag">퀴즈</span><h2>누가 하는 일일까?</h2></div>
   <div class="quiz"><div class="board"><div class="dots">${dots}</div><span class="qn">${qi+1}번 문제</span><p>${q.q}</p></div><div class="opts">${opts}</div></div>`;
  say('알맞은 답을 눌러 보세요.');nextBtn.disabled=true;
  stage.querySelectorAll('.opt').forEach(b=>b.addEventListener('click',()=>{
    if(+b.dataset.i===q.a){
      if(tries===0)score++;
      b.classList.add('right');stage.querySelectorAll('.opt').forEach(x=>x.disabled=true);
      say('맞았어요! '+q.why);nextBtn.disabled=false;
    }else{tries++;b.classList.remove('wrong');void b.offsetWidth;b.classList.add('wrong');say('다시 생각해 봐요. 피자 나누기를 떠올려 보세요.')}
  }));
}
function finish(){
  stage.innerHTML=`<div class="wallart"></div><div class="bunting"></div><div class="finish">
   <div class="pic"><img class="cheer" src="{{IMG:finish_cheer}}" alt="피자를 똑같이 나눠 들고 웃는 친구들"><img class="badge" src="{{IMG:badge_complete}}" alt="완료 메달"></div>
   <div class="txt"><h3>삼권분립<br>이해 완료!</h3><div class="score">한 번에 맞힌 문제 <b>${score}</b> / ${Q.length}</div>
    <div class="sum"><span>${icon('r1')}국회는 법을 만들어요</span><span>${icon('r2')}정부는 법대로 일해요</span><span>${icon('r3')}법원은 법을 지켰는지 판단해요</span></div>
    <button type="button" class="again" id="again">처음부터 다시</button></div></div>`;
  say('잘했어요! 나라의 일을 나눠 맡고 서로 지켜보는 것, 이것이 삼권분립이에요.');
  done.add(4);drawSteps();nextBtn.disabled=true;
  $('#again').addEventListener('click',()=>{done.clear();go(0)});
}

function drawSteps(){
  $('#steps').innerHTML=SCENES.map((s,i)=>`${i?'<span class="link"></span>':''}<button type="button" class="node ${i===scene?'on':''} ${done.has(i)?'done':''}" data-i="${i}"><b>${done.has(i)&&i!==scene?'✓':i+1}</b>${s.name}</button>`).join('');
  $('#steps').querySelectorAll('.node').forEach(b=>b.addEventListener('click',()=>{if(!busy)go(+b.dataset.i)}));
}
async function run(){
  busy=true;nextBtn.disabled=true;
  const r=await SCENES[scene].steps[step]();
  busy=false;if(r!=='lock')nextBtn.disabled=false;
}
function go(i){scene=i;step=0;SCENES[i].render();drawSteps();run()}
nextBtn.addEventListener('click',()=>{
  if(busy)return;
  if(scene===4){if(qi<Q.length-1){qi++;showQ()}else finish();return}
  if(step<SCENES[scene].steps.length-1){step++;run()}
  else{done.add(scene);go(scene+1)}
});
go(0);
</script>
</body>
</html>
